<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reklam Altyapısı Simülatörü</title>
  <meta name="description" content="Bir ziyaretçinin verisi DMP, Ad Server ve Clean Room'da nasıl dolaşır? Metro haritası üzerinde etkileşimli, animasyonlu mimari simülasyonu.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#131922">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23131922'/%3E%3Cpath d='M3 24 L12 15' stroke='%237a3fe0' stroke-width='4'/%3E%3Cpath d='M20 16 H29' stroke='%231d6bd3' stroke-width='4'/%3E%3Cpath d='M16 3 V10' stroke='%23d23a3a' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff' stroke='%23131922' stroke-width='2'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/diagram.css">
  <link rel="stylesheet" href="css/device.css">
  <link rel="stylesheet" href="css/inspector.css">
  <link rel="stylesheet" href="css/controls.css">

  <script src="js/core.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/engine.js" defer></script>
  <script src="js/diagram.js" defer></script>
  <script src="js/device.js" defer></script>
  <script src="js/inspector.js" defer></script>
  <script src="js/controls.js" defer></script>
  <script src="js/tour.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <path class="bm-line bm-dmp" d="M3 35 L15 23"/>
          <path class="bm-line bm-ad" d="M26 20 H38"/>
          <path class="bm-line bm-cr" d="M20 2 V13"/>
          <circle class="bm-hub" cx="20" cy="20" r="8.5"/>
        </svg>
        <div class="brand-text">
          <div class="brand-head">
            <h1 class="brand-title">Reklam Altyapısı Simülatörü</h1>
            <ul class="line-badges" aria-label="Hatlar">
              <li title="D · Veri Hattı"><span class="line-badge" data-line="dmp" aria-hidden="true">D</span><span class="sr-only">D: Veri Hattı</span></li>
              <li title="A · Reklam Hattı"><span class="line-badge" data-line="ad" aria-hidden="true">A</span><span class="sr-only">A: Reklam Hattı</span></li>
              <li title="Ö · Ölçüm Hattı"><span class="line-badge" data-line="measure" aria-hidden="true">Ö</span><span class="sr-only">Ö: Ölçüm Hattı</span></li>
              <li title="C · Clean Room Hattı"><span class="line-badge" data-line="cleanroom" aria-hidden="true">C</span><span class="sr-only">C: Clean Room Hattı</span></li>
              <li title="R · Rıza &amp; Gizlilik Hattı"><span class="line-badge" data-line="privacy" aria-hidden="true">R</span><span class="sr-only">R: Rıza ve Gizlilik Hattı</span></li>
              <li title="K · Kontrol Hattı"><span class="line-badge" data-line="control" aria-hidden="true">K</span><span class="sr-only">K: Kontrol Hattı</span></li>
            </ul>
          </div>
          <p class="brand-sub">Bir ziyaretçinin verisi DMP, Ad Server ve Clean Room'da nasıl dolaşır?</p>
        </div>
      </div>
      <div id="tour-controls"></div>      <!-- integration doldurur -->
      <div id="sim-controls"></div>       <!-- integration doldurur: hız, duraklat, adım modu, arka plan trafiği, sıfırla -->
    </header>
    <main class="stage">
      <section id="device-pane" class="pane pane-device" aria-label="Simüle edilen yayıncı sitesi">
        <div id="device-root"></div>
      </section>
      <section id="map-pane" class="pane pane-map" aria-label="Veri akış haritası">
        <div id="map-legend"></div>
        <div id="diagram-root"></div>
        <div id="narration" class="narration" aria-live="polite"></div>
      </section>
      <section id="inspector-pane" class="pane pane-inspector" aria-label="Sistem içi görünüm">
        <div id="inspector-root"></div>
      </section>
    </main>
    <nav id="action-bar" class="action-bar" aria-label="Ziyaretçi aksiyonları"></nav>
    <div id="tour-overlay"></div>
  </div>
  <noscript>
    <p style="padding:16px;margin:0;font-family:sans-serif">Bu simülatör JavaScript gerektirir. Lütfen tarayıcınızda JavaScript’i etkinleştirin.</p>
  </noscript>
</body>
</html>
