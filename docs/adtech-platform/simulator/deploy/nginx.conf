server {
    # Yalnızca IPv4: "listen [::]:80" IPv6'sı kapalı sunucularda nginx'i başlatmaz.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Konteyner ve yük dengeleyici sağlık kontrolü
    location = /saglik {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mimari dokümanları (Markdown) tarayıcıda düz metin olarak açılır
    location /docs/ {
        types {
            text/plain md;
            image/png  png;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # nginx'te alt bloktaki add_header üst bloktakileri ezer; başlıkların hepsi burada.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
