<!DOCTYPE html>
<html lang="tr">
<!-- Tek dosyalık sürüm: tools/bundle.mjs ile index.html'den üretildi. Düzenlemeyin; kaynak dosyaları değiştirip yeniden üretin. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reklam Altyapısı Simülatörü</title>
  <meta name="description" content="Bir ziyaretçinin verisi DMP, Ad Server ve Clean Room'da nasıl dolaşır? Metro haritası üzerinde etkileşimli, animasyonlu mimari simülasyonu.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#131922">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23131922'/%3E%3Cpath d='M3 24 L12 15' stroke='%237a3fe0' stroke-width='4'/%3E%3Cpath d='M20 16 H29' stroke='%231d6bd3' stroke-width='4'/%3E%3Cpath d='M16 3 V10' stroke='%23d23a3a' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff' stroke='%23131922' stroke-width='2'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">

  <style data-src="css/base.css">
/* base.css — [foundation] token'lar, tema, yerleşim, ortak bileşenler (SPEC.md §2, §3)
 * Fikir: metro haritası / şehir içi hat tabelası. Başlıklar tabela harfi (Barlow Condensed),
 * gövde IBM Plex Sans, veri IBM Plex Mono. Tüm renkler token'dan gelir.
 *
 * Modüller için:
 *  - Hat rengi: herhangi bir öğeye data-line="dmp|ad|measure|cleanroom|privacy|control" verin;
 *    o öğe ve çocuklarında var(--lc) = hat rengi (çizgi/kenar), var(--lf) = beyaz yazı taşıyabilen dolgu.
 *  - Ortak sınıflar: .btn .btn-primary .btn-ghost .btn-sm .btn-icon .btn-group .chip .line-badge
 *    .tabs .tab .card .kv .mono .num .pill .pill-ok/.pill-warn/.pill-bad/.pill-muted .sr-only
 *    .switch .input .table .eyebrow
 */

/* ===================================================================
 * 1. Token'lar — açık tema (varsayılan)
 * =================================================================== */
:root {
  /* yerleşim fikri: üç pano — site | metro haritası | sistem içi */
  --bg: #eceff3;  --surface: #ffffff;  --surface-2: #f5f7f9;
  --ink: #131922; --muted: #5a6573; --rule: #d3d9e0;
  --line-dmp: #7a3fe0; --line-ad: #1d6bd3; --line-measure: #0d8f83;
  --line-cleanroom: #d23a3a; --line-privacy: #c97a00; --line-control: #5a6878;
  --ok: #1a8f4c; --warn: #c27c00; --bad: #c8322f;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;

  /* --- ekler --- */
  --surface-3: #e7ebf0;          /* basılı durum, iz (track) */
  --ink-2: #2a3340;              /* ikincil güçlü metin, primary hover */
  --rule-strong: #b6bfca;
  --focus: #1d6bd3;
  --on-line: #ffffff;            /* dolgu (--lf) üzerindeki yazı */
  --grid-dot: rgba(19, 25, 34, 0.085);
  --scrim: rgba(12, 18, 25, 0.48);
  --shadow-1: 0 1px 2px rgba(19, 25, 34, 0.06), 0 1px 1px rgba(19, 25, 34, 0.04);
  --shadow-2: 0 10px 28px rgba(19, 25, 34, 0.14), 0 2px 6px rgba(19, 25, 34, 0.08);

  /* Hat dolguları: beyaz harf için ≥ 5:1 kontrast; iki temada da aynı. */
  --fill-dmp: #7a3fe0; --fill-ad: #1d6bd3; --fill-measure: #0b7a70;
  --fill-cleanroom: #c43131; --fill-privacy: #a05f00; --fill-control: #56636f;

  /* Tabela bandı (üst bar) — iki temada da koyu */
  --sign-bg: #131922; --sign-surface: #1c2531; --sign-surface-2: #253041; --sign-surface-3: #2c3849;
  --sign-ink: #f3f5f8; --sign-ink-2: #d9dfe6; --sign-muted: #9ba7b5;
  --sign-rule: #2f3b4b; --sign-rule-strong: #46546a; --sign-focus: #8ab8ff;

  /* Tipografi ölçeği */
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px;
  --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 36px;

  /* Boşluk ölçeği */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;

  --radius-sm: 6px; --radius-xs: 3px;
  --pane-pad: 16px;              /* panolar kendi dolgusunu vermez; modüller kökte bunu kullanır */
  --touch: 40px;                 /* telefonda en küçük dokunma hedefi */
  --actionbar-h: 64px;           /* telefonda sabit aksiyon çubuğu yüksekliği */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-1: 120ms; --dur-2: 220ms; --dur-3: 420ms;

  color-scheme: light;
}

/* ===================================================================
 * 2. Koyu tema — sistem tercihi (açık zorlanmadıysa) ve elle seçim
 * =================================================================== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1219; --surface: #141c26; --surface-2: #1a2430;
    --ink: #e7ecf2; --muted: #93a0af; --rule: #283442;
    --line-dmp: #a07cff; --line-ad: #4d93ff; --line-measure: #27c0b1;
    --line-cleanroom: #ff6767; --line-privacy: #f2ac35; --line-control: #8e9cad;
    --ok: #3ec27c; --warn: #f0ad3d; --bad: #ff6b66;

    --surface-3: #223041;
    --ink-2: #c9d2dc;
    --rule-strong: #3b4959;
    --focus: #7fb0ff;
    --grid-dot: rgba(231, 236, 242, 0.06);
    --scrim: rgba(3, 6, 10, 0.62);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);

    --sign-bg: #070b10; --sign-surface: #121a24; --sign-surface-2: #1a2430; --sign-surface-3: #223041;
    --sign-rule: #222d3a; --sign-rule-strong: #3b4959;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1219; --surface: #141c26; --surface-2: #1a2430;
  --ink: #e7ecf2; --muted: #93a0af; --rule: #283442;
  --line-dmp: #a07cff; --line-ad: #4d93ff; --line-measure: #27c0b1;
  --line-cleanroom: #ff6767; --line-privacy: #f2ac35; --line-control: #8e9cad;
  --ok: #3ec27c; --warn: #f0ad3d; --bad: #ff6b66;

  --surface-3: #223041;
  --ink-2: #c9d2dc;
  --rule-strong: #3b4959;
  --focus: #7fb0ff;
  --grid-dot: rgba(231, 236, 242, 0.06);
  --scrim: rgba(3, 6, 10, 0.62);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-2: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);

  --sign-bg: #070b10; --sign-surface: #121a24; --sign-surface-2: #1a2430; --sign-surface-3: #223041;
  --sign-rule: #222d3a; --sign-rule-strong: #3b4959;

  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* Hat rengi eşlemesi: bileşenler var(--lc) (çizgi) ve var(--lf) (dolgu) kullanır */
[data-line="dmp"]       { --lc: var(--line-dmp);       --lf: var(--fill-dmp); }
[data-line="ad"]        { --lc: var(--line-ad);        --lf: var(--fill-ad); }
[data-line="measure"]   { --lc: var(--line-measure);   --lf: var(--fill-measure); }
[data-line="cleanroom"] { --lc: var(--line-cleanroom); --lf: var(--fill-cleanroom); }
[data-line="privacy"]   { --lc: var(--line-privacy);   --lf: var(--fill-privacy); }
[data-line="control"]   { --lc: var(--line-control);   --lf: var(--fill-control); }

/* ===================================================================
 * 3. Temel öğeler ve tipografi
 * =================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}
html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.5;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}

h1, h2, h3, h4, h5, h6 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: 0.005em;
  color: var(--ink);
}
h1 { font-size: var(--fs-3xl); }
h2 { font-size: var(--fs-2xl); }
h3 { font-size: var(--fs-xl); }
h4 { font-size: var(--fs-lg); }
h5, h6 { font-size: var(--fs-md); }

p { margin: 0 0 0.75em; }
p:last-child { margin-bottom: 0; }
a { color: var(--line-ad); text-underline-offset: 0.15em; }
a:hover { text-decoration-thickness: 2px; }
small { font-size: var(--fs-sm); }
strong, b { font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--rule); margin: var(--sp-4) 0; }
img, svg, video, canvas { max-width: 100%; }

code, kbd, samp, pre { font-family: var(--font-mono); font-size: 0.92em; }
pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 0.05em 0.4em;
  border: 1px solid var(--rule-strong);
  border-bottom-width: 2px;
  border-radius: var(--radius-xs);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.82em;
  line-height: 1.4;
  text-align: center;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }

::selection { background: rgba(29, 107, 211, 0.24); }

/* Tipografi yardımcıları */
.display { font-family: var(--font-display); }
.t-3xl { font-size: var(--fs-3xl); } .t-2xl { font-size: var(--fs-2xl); } .t-xl { font-size: var(--fs-xl); }
.t-lg { font-size: var(--fs-lg); } .t-md { font-size: var(--fs-md); } .t-sm { font-size: var(--fs-sm); }
.t-xs { font-size: var(--fs-xs); } .t-2xs { font-size: var(--fs-2xs); }
.muted { color: var(--muted); }
.eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--fs-xs);
  line-height: 1.2;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.mono {
  font-family: var(--font-mono);
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.break { overflow-wrap: anywhere; }

/* Odak halkası */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .switch:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ===================================================================
 * 4. Yerleşim — uygulama iskeleti
 *    ≥ 1180: üst bar / aksiyon çubuğu / 3 sütun (360 | 1fr | 420), panolar içte kayar
 *    820–1179: cihaz + harita yan yana (340 | 1fr), inspector altta; sayfa kayar
 *    < 820: tek sütun (cihaz → harita → inspector), aksiyon çubuğu altta sabit
 * =================================================================== */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
.app > .topbar     { order: 0; }
.app > .action-bar { order: 1; }
.app > .stage      { order: 2; }

.stage {
  position: relative;
  min-width: 0;
}

.pane {
  position: relative;
  min-width: 0;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
}
.pane::-webkit-scrollbar { width: 10px; height: 10px; }
.pane::-webkit-scrollbar-thumb {
  background: var(--rule-strong);
  border: 3px solid transparent;
  border-radius: 10px;
  background-clip: content-box;
}
.pane::-webkit-scrollbar-track { background: transparent; }

.pane-device {
  background: var(--surface-2);
}
.pane-map {
  display: flex;
  flex-direction: column;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.4px);
  background-size: 18px 18px;
  background-position: 9px 9px;
}
.pane-inspector {
  background: var(--surface);
}

#device-root { position: relative; min-width: 0; }
#inspector-root { position: relative; min-width: 0; }

#map-legend {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 10px var(--pane-pad);
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
#map-legend:empty { display: none; }

#diagram-root {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}

.narration {
  flex: 0 0 auto;
  position: relative;
  min-height: 56px;
  padding: 10px var(--pane-pad);
  border-top: 1px solid var(--rule);
  background: var(--surface);
  font-size: var(--fs-sm);
}

/* Tur katmanı: yerleşimi etkilemez; içeriği integration doldurur */
#tour-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
}
#tour-overlay > * { pointer-events: auto; }
#tour-overlay:empty { display: none; }

/* ---- Üst bar: tabela bandı ---- */
.topbar {
  /* Bant içindeki bileşenler (btn, chip, switch) koyu yüzeye otomatik uyum sağlasın */
  --surface: var(--sign-surface);
  --surface-2: var(--sign-surface-2);
  --surface-3: var(--sign-surface-3);
  --ink: var(--sign-ink);
  --ink-2: var(--sign-ink-2);
  --muted: var(--sign-muted);
  --rule: var(--sign-rule);
  --rule-strong: var(--sign-rule-strong);
  --focus: var(--sign-focus);
  color-scheme: dark;

  position: relative;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 20px;
  padding: 10px 20px 13px;
  background: var(--sign-bg);
  color: var(--ink);
}
/* Alt kenarda hat şeridi: altı hat renginde keskin bölümler */
.topbar::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: linear-gradient(90deg,
    var(--line-dmp) 0 16.666%,
    var(--line-ad) 16.666% 33.333%,
    var(--line-measure) 33.333% 50%,
    var(--line-cleanroom) 50% 66.666%,
    var(--line-privacy) 66.666% 83.333%,
    var(--line-control) 83.333% 100%);
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  margin-right: auto;
}
.brand-mark {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  color: var(--ink);
}
.brand-mark .bm-line { fill: none; stroke-width: 5; stroke-linecap: butt; }
.brand-mark .bm-dmp { stroke: var(--line-dmp); }
.brand-mark .bm-ad { stroke: var(--line-ad); }
.brand-mark .bm-cr { stroke: var(--line-cleanroom); }
.brand-mark .bm-hub { fill: #ffffff; stroke: var(--sign-bg); stroke-width: 3; }

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.brand-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
}
.brand-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.brand-sub {
  margin: 0;
  font-size: var(--fs-sm);
  line-height: 1.35;
  color: var(--muted);
}

.line-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.line-badges > li { display: flex; }

#tour-controls, #sim-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
#tour-controls:empty, #sim-controls:empty { display: none; }

/* ---- Aksiyon çubuğu ---- */
.action-bar {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 8px 20px;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.action-bar::-webkit-scrollbar { display: none; }
.action-bar > * { flex: 0 0 auto; white-space: nowrap; }

/* ---------- ≥ 1180px: tam ekran 3 sütun ---------- */
@media (min-width: 1180px) {
  html, body { height: 100%; }
  body { min-height: 0; }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .app > .topbar     { grid-row: 1; }
  .app > .action-bar { grid-row: 2; }
  .app > .stage      { grid-row: 3; }

  .stage {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr) 420px;
    grid-template-rows: minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
  }
  .pane { overflow: auto; overscroll-behavior: contain; }
  .pane-device { border-right: 1px solid var(--rule); }
  .pane-map { overflow: hidden; }
  .pane-inspector { border-left: 1px solid var(--rule); }
}

/* ---------- 820–1179px: cihaz + harita yan yana, inspector altta ---------- */
@media (min-width: 820px) and (max-width: 1179.98px) {
  .action-bar {
    position: sticky;
    top: 0;
    padding-inline: 16px;
  }
  .topbar { padding-inline: 16px; }
  .stage {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    grid-template-rows: clamp(560px, calc(100vh - 150px), 880px) auto;
  }
  .pane-device {
    grid-column: 1; grid-row: 1;
    overflow: auto;
    overscroll-behavior: contain;
    border-right: 1px solid var(--rule);
  }
  .pane-map {
    grid-column: 2; grid-row: 1;
    overflow: hidden;
  }
  .pane-inspector {
    grid-column: 1 / -1; grid-row: 2;
    min-height: 520px;
    border-top: 1px solid var(--rule);
  }
}

/* ---------- < 820px: telefon ---------- */
@media (max-width: 819.98px) {
  :root { --pane-pad: 16px; }
  body {
    padding-bottom: calc(var(--actionbar-h) + env(safe-area-inset-bottom, 0px));
  }
  .stage {
    display: flex;
    flex-direction: column;
  }
  .pane + .pane { border-top: 1px solid var(--rule); }
  #map-legend { padding: 10px 16px; }
  #device-root { max-width: 520px; margin-inline: auto; }

  /* kompakt üst bar */
  .topbar { gap: 10px 12px; padding: 10px 16px 13px; }
  .brand { gap: 10px; margin-right: 0; flex: 1 1 100%; align-items: flex-start; }
  .brand-mark { width: 30px; height: 30px; margin-top: 1px; }
  .brand-title { font-size: 21px; }
  .brand-sub { font-size: var(--fs-xs); }
  .brand-head { gap: 6px 10px; }
  .line-badges .line-badge { --size: 18px; }
  #tour-controls, #sim-controls { flex: 1 1 100%; }
  #sim-controls {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    margin-inline: -16px;
    padding-inline: 16px;
  }
  #sim-controls::-webkit-scrollbar { display: none; }
  #sim-controls > * { flex: 0 0 auto; }

  /* altta sabit aksiyon çubuğu: yatay kayan çipler */
  .action-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    height: calc(var(--actionbar-h) + env(safe-area-inset-bottom, 0px));

/* ------------------------------------------------------------------
 * Başlık
 * ------------------------------------------------------------------ */
.ins-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  padding: 14px var(--pane-pad) 8px;
}
.ins-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.1;
  letter-spacing: 0.01em;
}
.ins-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  font-size: var(--fs-xs);
  color: var(--muted);
  white-space: nowrap;
}
.ins-live {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rule-strong);
  flex: 0 0 auto;
}
.ins-live[data-state="busy"] { background: var(--lc, var(--ok)); animation: ins-pulse 1.1s ease-in-out infinite; }
.ins-live[data-state="paused"] { background: var(--warn); border-radius: 1px; }
.ins-clock { color: var(--ink-2); font-size: var(--fs-xs); }
.ins-sep { color: var(--rule-strong); }

/* ------------------------------------------------------------------
 * Sekmeler — telefon: yatay kayan çip satırı
 * ------------------------------------------------------------------ */
.ins-tabs {
  position: sticky;
  top: 0;
  z-index: 6;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px var(--pane-pad) 10px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  scroll-padding-inline: var(--pane-pad);
  -webkit-overflow-scrolling: touch;
}
.ins-tabs::-webkit-scrollbar { display: none; }
.ins-tab {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: var(--touch);
  margin: 0;
  padding: 0 14px;
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--fs-sm);
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-1) ease, border-color var(--dur-1) ease, color var(--dur-1) ease;
}
.ins-tab:hover { border-color: var(--muted); }
.ins-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ins-tab-mark {
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-radius: 1px;
  box-shadow: inset 0 0 0 1.5px var(--muted);
}
.ins-tab[data-line] .ins-tab-mark { background: var(--lc); box-shadow: none; }
.ins-tab[aria-selected="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.ins-tab[data-line][aria-selected="true"] {
  background: var(--lf);
  border-color: var(--lf);
  color: var(--on-line);
}
.ins-tab[aria-selected="true"] .ins-tab-mark { background: currentColor; box-shadow: none; }
.ins-tab-label { position: relative; }
.ins-dot {
  display: none;
  position: absolute;
  top: -6px;
  right: -11px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--focus);
  box-shadow: 0 0 0 2px var(--surface);
}
.ins-tab[data-unread="true"] .ins-dot { display: block; }

/* ≥ 820: alt çizgili tabela sekmeleri */
@media (min-width: 820px) {
  .ins-tabs {
    position: static;
    flex-wrap: wrap;
    gap: 0 4px;
    overflow: visible;
    padding: 0 var(--pane-pad);
    background: transparent;
  }
  .ins-tab {
    min-height: 42px;
    margin-bottom: -1px;
    padding: 10px 10px 8px;
    border: 0;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .ins-tab:hover { color: var(--ink); border-bottom-color: var(--rule-strong); }
  .ins-tab:focus-visible { outline-offset: -3px; }
  .ins-tab[aria-selected="true"],
  .ins-tab[data-line][aria-selected="true"] {
    background: transparent;
    color: var(--ink);
    border-bottom-color: var(--lc, var(--ink));
  }
  .ins-tab[aria-selected="true"] .ins-tab-mark { background: var(--lc, var(--ink)); }
  .ins-dot { top: -3px; right: -10px; box-shadow: none; }
  .ins-tab { padding-right: 11px; }
}

/* ≥ 1180: 420 px sütun — 4 × 2 sekme ızgarası, gövde içte kayar */
@media (min-width: 1180px) {
  #inspector-root.ins { height: 100%; }
  .ins-tabs {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: space-between;
    gap: 0 4px;
  }
  .ins-tab {
    gap: 6px;
    padding: 9px 10px 7px 2px;
    font-size: 15px;
    white-space: normal;
    text-align: left;
  }
  .ins-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--rule-strong) transparent;
  }
  .ins-body::-webkit-scrollbar { width: 10px; }
  .ins-body::-webkit-scrollbar-thumb {
    background: var(--rule-strong);
    border: 3px solid transparent;
    border-radius: 10px;
    background-clip: content-box;
  }
}

/* ------------------------------------------------------------------
 * Gövde, bölümler, ortak parçalar
 * ------------------------------------------------------------------ */
.ins-body { min-width: 0; }
.ins-panel { min-width: 0; padding: 14px var(--pane-pad) 28px; }
.ins-panel[hidden] { display: none; }
.ins-panel:focus-visible { outline: 2px solid var(--focus); outline-offset: -3px; }
.ins-panel > :first-child { margin-top: 0; }

.ins-sec { min-width: 0; margin-top: 22px; }
.ins-sec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  margin: 0 0 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.ins-h {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.15;
  letter-spacing: 0.01em;
}
.ins-sec-meta {
  margin-left: auto;
  font-size: var(--fs-xs);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.ins-note { margin: 8px 0 0; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); }
.ins-caption { margin: 8px 0 0; font-size: var(--fs-xs); line-height: 1.45; color: var(--muted); }
.ins-caption.mono { font-size: 11px; overflow-wrap: anywhere; }
.ins-lead { margin: 0 0 12px; font-size: var(--fs-xs); color: var(--muted); }
.ins-lead[hidden] { display: none; }
.ins-explain {
  margin: 10px 0 0;
  padding: 8px 10px 8px 12px;
  border-left: 3px solid var(--line-ad);
  background: var(--surface-2);
  font-size: var(--fs-sm);
}
.ins-pg { font-weight: 700; }

.ins-empty {
  padding: 14px 16px;
  border: 1px dashed var(--rule-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.ins-empty[hidden] { display: none; }
.ins-empty-title {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.2;
}
.ins-empty-text { margin: 0; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink-2); }
.ins-empty[data-kind="warn"] { border-style: solid; border-color: var(--rule); border-left: 4px solid var(--warn); }
.ins-empty[data-kind="privacy"] { border-style: solid; border-color: var(--rule); border-left: 4px solid var(--line-privacy); }

/* Özet şeridi: 2 sütun (tablette 4) */
.ins-sum {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  margin: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--rule);
  overflow: hidden;
}
.ins-sum-cell { min-width: 0; padding: 8px 10px 9px; background: var(--surface); }
.ins-sum-cell dt {
  margin: 0 0 2px;
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.ins-sum-cell dd { display: flex; flex-direction: column; gap: 1px; min-width: 0; margin: 0; }
.ins-sum-v { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.ins-sum-v.mono { font-size: 14px; font-weight: 500; }
.ins-sum-sub { font-size: var(--fs-xs); line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
.ins-sum-cell.is-on .ins-sum-v::before,
.ins-sum-cell.is-off .ins-sum-v::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: 1px;
  background: var(--ok);
}
.ins-sum-cell.is-off .ins-sum-v::before { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }

.ins-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 8px;
  margin-bottom: 4px;
}

/* Açılır bölümler */
.ins-details { margin-top: 6px; }
.ins-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-height: 32px;
  padding: 4px 2px;
  border-radius: var(--radius-xs);
  font-size: var(--fs-xs);
  color: var(--ink-2);
  cursor: pointer;
  list-style: none;
  -webkit-tap-highlight-color: transparent;
}
.ins-summary::-webkit-details-marker { display: none; }
.ins-summary::before {
  content: "";
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  margin: 0 3px 2px 1px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform var(--dur-1) ease;
}
details[open] > .ins-summary::before { transform: rotate(45deg); margin-bottom: 4px; }
.ins-summary:hover { color: var(--ink); }
.ins-sum-label { font-weight: 600; color: var(--ink); }
.ins-sum-meta { font-size: var(--fs-2xs); color: var(--muted); }

/* Tablolar */
.ins-table { font-size: var(--fs-sm); }
.ins-table th { padding: 6px 6px; }
.ins-table td { padding: 8px 6px; vertical-align: top; }
.ins-table th:first-child, .ins-table td:first-child { padding-left: 0; }
.ins-table th:last-child, .ins-table td:last-child { padding-right: 0; }
.ins-table .num { font-variant-numeric: tabular-nums; }
.ins-c-name { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ins-c-id { margin-left: 5px; font-size: 11px; color: var(--muted); }
.ins-c-sub { display: block; margin-top: 1px; font-size: var(--fs-2xs); line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
.ins-c-formula { display: block; margin-top: 2px; font-size: 11px; line-height: 1.4; color: var(--ink-2); overflow-wrap: anywhere; }
.ins-reason { display: block; margin-top: 3px; font-size: var(--fs-2xs); line-height: 1.3; color: var(--muted); }
.ins-dash { color: var(--muted); }

/* ------------------------------------------------------------------
 * JSON görünümü
 * ------------------------------------------------------------------ */
.ins-json {
  margin-top: 6px;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.j-line {
  margin-left: -4px;
  padding-left: calc(var(--d, 0) * 14px + 4px);
  border-radius: 2px;
  white-space: pre-wrap;
  transition: background-color 700ms ease, box-shadow 700ms ease;
}
.j-key { color: var(--ink); }
.j-punc { color: var(--muted); }
.j-str { color: var(--ink-2); color: color-mix(in srgb, var(--line-measure) 70%, var(--ink)); }
.j-num { color: var(--ink-2); color: color-mix(in srgb, var(--line-ad) 74%, var(--ink)); }
.j-bool, .j-null { color: var(--ink-2); color: color-mix(in srgb, var(--line-dmp) 74%, var(--ink)); }
.j-note { color: var(--muted); font-size: 11px; }
.j-line.is-changed {
  background: var(--surface-3);
  background: color-mix(in srgb, var(--line-dmp) 17%, transparent);
  box-shadow: inset 3px 0 0 var(--line-dmp);
}

/* ------------------------------------------------------------------
 * 1) Akış — metro zaman çizelgesi
 * ------------------------------------------------------------------ */
.ins-flow-head .ins-sec-meta { font-size: var(--fs-2xs); }
.ins-tl { display: flex; flex-direction: column; gap: 16px; }
.ins-tl-group { --gc: var(--lc, var(--line-control)); min-width: 0; }
.ins-tl-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 0 6px;
  border-bottom: 1px solid var(--rule);
}
.ins-tl-badge { display: inline-flex; flex: 0 0 auto; }
.ins-tl-headtext { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
.ins-tl-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.ins-tl-meta { font-size: var(--fs-2xs); color: var(--muted); overflow-wrap: anywhere; }
.ins-tl-state {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 5px;
  font-size: var(--fs-2xs);
  color: var(--muted);
  white-space: nowrap;
}
.ins-tl-state[data-state="running"] { color: var(--ink); font-weight: 600; }
.ins-run-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  animation: ins-pulse 1.1s ease-in-out infinite;
}
.ins-tl-list { margin: 0; padding: 4px 0 0; list-style: none; }
.ins-tl-item {
  display: grid;
  grid-template-columns: 4.7em 16px minmax(0, 1fr);
  column-gap: 8px;
  padding: 6px 0;
}
.ins-tl-time { padding-top: 3px; font-size: var(--fs-2xs); color: var(--muted); white-space: nowrap; }
.ins-tl-rail { position: relative; }
.ins-tl-rail::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -6px;
  bottom: -6px;
  width: 4px;
  margin-left: -2px;
  background: var(--gc);
}
.ins-tl-item:first-child .ins-tl-rail::before { top: 9px; }
.ins-tl-item:last-child .ins-tl-rail::before { bottom: auto; height: 15px; }
.ins-tl-item:first-child:last-child .ins-tl-rail::before { display: none; }
.ins-tl-dot {
  position: absolute;
  left: 50%;
  top: 3px;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border: 3px solid var(--lc, var(--gc));
  border-radius: 50%;
  background: var(--surface);
}
.ins-tl-item[data-kind="ok"] .ins-tl-dot { background: var(--lc, var(--gc)); box-shadow: inset 0 0 0 2px var(--surface); }
.ins-tl-item[data-kind="warn"] .ins-tl-dot {
  border: 0;
  border-radius: 0;
  background: var(--warn);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.ins-tl-item[data-kind="drop"] .ins-tl-dot {
  top: 4px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border: 0;
  border-radius: 2px;
  background: var(--bad);
}
.ins-tl-body { min-width: 0; }
.ins-tl-where { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; margin-bottom: 1px; }
.ins-tl-node { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; }
.ins-k-ok { color: var(--ok); font-weight: 700; font-size: 13px; line-height: 1; }
.ins-tl-text { margin: 0; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.ins-tl-item.is-new { animation: ins-in 360ms var(--ease-out) both; }
.ins-tl-item.is-new .ins-tl-dot { animation: ins-pop 560ms var(--ease-out); }

/* ------------------------------------------------------------------
 * 2) Kafka
 * ------------------------------------------------------------------ */
.ins-kf { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.ins-kchip { font-size: var(--fs-xs); }
.ins-kchip .mono { font-size: 11.5px; }
.ins-kchip[aria-pressed="true"] > .chip-count { background: transparent; background: color-mix(in srgb, currentColor 20%, transparent); color: inherit; }
.ins-klist { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.ins-kmsg { position: relative; padding: 9px 0 8px 13px; border-bottom: 1px solid var(--rule); }
.ins-kmsg::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 1px;
  background: var(--lc, var(--rule-strong));
}
.ins-kmsg .ins-topic::before { display: none; }
.ins-kmsg.is-new { animation: ins-in 320ms var(--ease-out) both; }
.ins-kmsg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; }
.ins-topic {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.ins-topic::before {
  content: "";
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--lc, var(--muted));
}
.ins-kpos { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ins-ktime { margin-left: auto; font-size: var(--fs-2xs); color: var(--muted); }
.ins-kkey { display: flex; align-items: baseline; gap: 6px; min-width: 0; margin-top: 2px; font-size: 12px; }
.ins-kkey-k {
  flex: 0 0 auto;
  font-size: var(--fs-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.ins-kkey code { min-width: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.ins-kt { padding: 0 6px; border-radius: 3px; background: var(--surface-3); font-size: 11.5px; color: var(--ink); }

/* ------------------------------------------------------------------
 * 3) Profil
 * ------------------------------------------------------------------ */
.ins-segs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ins-seg {
  display: flex;
  flex: 1 1 165px;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  max-width: 100%;
  padding: 7px 10px 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 2px var(--radius-sm) var(--radius-sm) 2px;
  background: var(--surface);
  box-shadow: inset 4px 0 0 var(--lc);
  transition: background-color 700ms ease, border-color 700ms ease;
}
.ins-seg-name { font-weight: 600; font-size: var(--fs-sm); line-height: 1.3; overflow-wrap: anywhere; }
.ins-seg-meta { font-size: var(--fs-2xs); color: var(--muted); }
.ins-seg-tag { align-self: flex-start; margin-top: 3px; }
.ins-seg.is-changed {
  border-color: var(--lc);
  background: var(--surface-2);
  background: color-mix(in srgb, var(--lc) 11%, var(--surface));
}
.ins-counters { margin-top: 10px; }
.ins-ctr-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
.ins-ctr {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 6px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-xs);
  background: var(--surface-2);
  font-size: var(--fs-xs);
}
.ins-ctr-k { font-weight: 600; }
.ins-ctr-s { font-size: var(--fs-2xs); color: var(--muted); }

.ins-idg-wrap { max-width: 400px; }
.ins-idg { display: block; width: 100%; height: auto; overflow: visible; }
.ins-idg-edge { fill: none; stroke: var(--line-dmp); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.ins-idg-dot { fill: var(--surface); stroke: var(--line-dmp); stroke-width: 3; }
.ins-idg-type { font-family: var(--font-display); font-weight: 600; font-size: 14px; fill: var(--ink); }
.ins-idg-typesub { font-family: var(--font-body); font-weight: 400; font-size: 11px; fill: var(--muted); }
.ins-idg-val { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); }
.ins-idg-cap { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.ins-idg-pid { font-family: var(--font-mono); font-weight: 500; font-size: 12px; fill: var(--ink); }
.ins-idg-ghost rect { fill: var(--surface); stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; }
.ins-idg-ghost text { font-family: var(--font-mono); font-size: 12px; fill: var(--muted); }

.ins-reckey { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 4px; font-size: var(--fs-xs); }
.ins-reckey-part { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; }
.ins-reckey-k { font-size: var(--fs-2xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ins-reckey code { font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
.ins-fresh {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;

}
.ins-fresh-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--line-dmp); }

.ins-idmap td { vertical-align: middle; }

/* ------------------------------------------------------------------

.ins-win { margin-top: 14px; }

.ins-shadow { display: inline-block; margin-top: 3px; font-size: var(--fs-2xs); color: var(--ink-2); }

.ins-c-st { min-width: 6.6em; }
.ins-cands tr.is-won td { background: var(--surface-2); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.ins-cands tr.is-won td:first-child { padding-left: 9px; box-shadow: inset 3px 0 0 var(--ok); }

.ins-b-lat { width: 36%; min-width: 104px; }
.ins-b-name { min-width: 6.4em; }
.ins-b-lath { white-space: normal !important; }
.ins-lat-legend {
  display: inline-flex;

}

.ins-bids tr.is-timeout .ins-c-name, .ins-bids tr.is-nobid .ins-c-name { color: var(--ink-2); font-weight: 500; }

/* Gecikme şelalesi */
.ins-wf-comp { margin-bottom: 14px; }

.ins-wf-axis, .ins-wf-row {

}

.ins-wf-k { font-size: var(--fs-xs); line-height: 1.25; color: var(--ink-2); overflow-wrap: anywhere; }
.ins-wf-track {

}

.ins-wf-v { font-size: var(--fs-xs); text-align: right; }

/* ------------------------------------------------------------------
 * 5) Raporlar
 * ------------------------------------------------------------------ */
.ins-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.ins-tile {

}

.ins-tile-v { font-family: var(--font-body); font-weight: 600; font-size: 20px; line-height: 1.15; overflow-wrap: anywhere; }
.ins-tile-s { font-size: 10.5px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }

.ins-spark { padding: 10px 12px 8px; border: 1px solid var(--rule); border-radius: var(--radius-sm); }
.ins-spark-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 8px; }

.ins-spark-span { font-size: var(--fs-xs); color: var(--muted); }
.ins-spark-now { margin-left: auto; font-weight: 600; font-size: 18px; }

.ins-spark-y { position: relative; font-size: 10.5px; color: var(--muted); }
.ins-spark-yl { position: absolute; right: 0; transform: translateY(-50%); line-height: 1; }

.ins-spark-plot:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

.ins-spark-end, .ins-spark-hdot {
  position: absolute;
  left: 100%;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;

  box-shadow: 0 0 0 2px var(--surface);
  pointer-events: none;
}

  border-radius: 2px;

  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  transform: translateY(-135%);

}

.ins-spark-cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-2); pointer-events: none; }
.ins-spark-tip {

}

.ins-spark-tip[data-align="start"] { transform: none; }
.ins-spark-cross[hidden], .ins-spark-hdot[hidden], .ins-spark-tip[hidden], .ins-spark-end[hidden], .ins-spark-endlab[hidden] { display: none; }
.ins-spark-x {

  justify-content: space-between;

}

.ins-rli tbody th[scope="row"] {

}

.ins-r-thr { white-space: nowrap; }
.ins-meter { display: block; width: 40px; height: 4px; margin: 5px 0 0 auto; overflow: hidden; border-radius: 2px; background: var(--surface-3); }

.ins-prog { display: flex; flex-direction: column; gap: 5px; }
.ins-prog-track {
  position: relative;

}

.ins-prog-row { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; font-size: var(--fs-2xs); color: var(--ink-2); }
.ins-prog-text { white-space: normal; }

/* ------------------------------------------------------------------
 * 6) Kampanyalar
 * ------------------------------------------------------------------ */
.ins-cfg { margin-bottom: 6px; }
.ins-cfg-row { display: flex; align-items: center; gap: 12px; }
.ins-cfg-ver {
  display: grid;
  flex: 0 0 auto;

}

.ins-camp { position: relative; padding: 12px 0 14px; border-bottom: 1px solid var(--rule); }

}

}

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 10px;
  align-items: start;
  margin-top: 10px;
}
.ins-field { display: flex; flex-direction: column; min-width: 0; }
.ins-field .field-label { min-height: 2.5em; display: flex; align-items: flex-end; line-height: 1.25; }
.ins-field .input { min-height: 38px; padding: 6px 10px; font-size: var(--fs-sm); }
.ins-field .input:disabled { opacity: 0.6; cursor: not-allowed; }
.ins-field .input[aria-invalid="true"] { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.ins-field-hint { margin-top: 3px; font-size: var(--fs-2xs); color: var(--muted); }
.ins-field-switch .switch { justify-content: flex-start; min-height: 38px; padding-left: 0; }
.ins-camp-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; }
.ins-camp-msg { font-size: var(--fs-xs); color: var(--muted); }
.ins-camp-msg.is-err { color: var(--bad); font-weight: 600; }
.ins-camp-msg.is-ok { color: var(--ink); font-weight: 600; }
.ins-spin {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: ins-spin 0.8s linear infinite;
}

/* ------------------------------------------------------------------
 * 7) Clean Room
 * ------------------------------------------------------------------ */
.ins-collab-title { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.ins-collab-id { margin: 2px 0 10px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ins-collab-kv { margin-bottom: 12px; }
.ins-eps-wrap { margin: 4px 0 14px; }

.ins-eps-k, .ins-eps-v { font-weight: 600; font-size: var(--fs-sm); }
.ins-eps-s { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); }
.ins-eps-cells { display: grid; grid-template-columns: repeat(var(--n, 20), minmax(0, 1fr)); gap: 2px; }
.ins-eps-cell {

}

.ins-cr-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

.ins-venn-fig { margin: 0 0 10px; }
.ins-venn { display: block; width: 100%; max-width: 400px; height: auto; overflow: visible; }

.ins-venn-ol { font-family: var(--font-body); font-weight: 600; font-size: 14px; fill: var(--ink); }
.ins-venn-in { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
.ins-venn-cap { font-family: var(--font-display); font-weight: 600; font-size: 13px; fill: var(--ink); }
.ins-venn-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: var(--fs-xs); color: var(--ink-2); }
.ins-venn-legend b { font-weight: 600; color: var(--ink); }
.ins-key.is-a, .ins-key.is-b { box-shadow: inset 0 0 0 2px var(--lk); background: transparent; }
.ins-key.is-a { --lk: var(--line-dmp); background: color-mix(in srgb, var(--line-dmp) 10%, transparent); }
.ins-key.is-b { --lk: var(--line-cleanroom); background: color-mix(in srgb, var(--line-cleanroom) 10%, transparent); }
.ins-key.is-o { background: var(--line-cleanroom); opacity: 0.7; }

.ins-dp {
  display: grid;
  gap: 1px;
  margin: 6px 0 10px;
  overflow: hidden;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);

}

.ins-dp-row.is-true { background: var(--surface-2); }
.ins-dp-k { display: flex; flex-direction: column; min-width: 0; font-weight: 600; font-size: var(--fs-sm); }
.ins-dp-s { font-weight: 400; font-size: var(--fs-xs); color: var(--muted); }
.ins-dp-v { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 20px; white-space: nowrap; }
.ins-dp-row.is-true .ins-dp-v { color: var(--ink-2); }
.ins-dp-noise { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); }
.ins-lock {
  position: relative;
  display: inline-block;

  width: 11px;
  height: 8px;
  margin-top: 5px;
  border-radius: 2px;
  background: var(--muted);
}
.ins-lock::before {
  content: "";
  position: absolute;
  left: 2px;
  top: -6px;
  width: 7px;
  height: 7px;

}

.ins-opaque {

}

.ins-opaque-title { flex: 1 1 160px; min-width: 0; font-weight: 600; font-size: var(--fs-sm); line-height: 1.3; }
.ins-opaque-text { margin: 6px 0 0; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); }
.ins-match { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; font-size: var(--fs-sm); line-height: 1.45; }

/* ------------------------------------------------------------------
 * 8) İstasyon
 * ------------------------------------------------------------------ */
.ins-node-head { position: relative; margin-bottom: 4px; padding: 2px 0 4px 14px; border-left: 4px solid var(--lc, var(--ink)); }
.ins-node-zone { display: block; margin-bottom: 3px; }
.ins-node-title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.05; }

  font-size: var(--fs-xs);
  line-height: 1.45;
}
.tr-note[hidden] { display: none; }

.tr-run {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 0;
  padding: 6px 0 0;
  border-top: 1px dashed var(--rule);
  font-size: var(--fs-xs);
  line-height: 1.4;
  color: var(--muted);
}
.tr-run-body { flex: 1 1 auto; min-width: 0; }
.tr-run-mark {
  flex: 0 0 auto;
  width: 10px;
  height: 10px;
  border: 2px solid var(--line-ad);
  border-radius: 50%;
}
.tr-run[data-state="running"] .tr-run-mark { border-color: var(--line-ad); border-right-color: transparent; animation: tr-spin 0.9s linear infinite; }
.tr-run[data-state="done"] .tr-run-mark { border-color: var(--ok); background: var(--ok); }
.tr-run[data-state="warn"] .tr-run-mark { border-color: var(--warn); background: var(--warn); border-radius: 2px; }
.tr-run[data-state="idle"] .tr-run-mark { border-color: var(--rule-strong); }
.tr-run[data-state="done"] { color: var(--ink); }
@keyframes tr-spin { to { transform: rotate(360deg); } }

.tr-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 12px 16px;
}
.tr-dots { display: flex; align-items: center; gap: 0; margin-right: auto; min-width: 0; }
.tr-dot {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex: 0 0 auto;
  width: 18px;
  height: 28px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.tr-dot::before {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 8px; height: 8px;
  margin: -4px 0 0 -4px;
  border: 2px solid var(--rule-strong);
  border-radius: 50%;
  background: var(--surface);
  transition: transform var(--dur-1) ease;
}
/* duraklar arası hat */
.tr-dot + .tr-dot::after {
  content: "";
  position: absolute;
  right: 50%;
  top: 50%;
  width: 18px;
  height: 2px;
  margin: -1px 0 0 0;
  background: var(--rule);
  z-index: -1;
}
.tr-dot.is-done::before { border-color: var(--ink); background: var(--ink); }
.tr-dot[aria-current="step"]::before { border-color: var(--ink); background: var(--surface); transform: scale(1.35); box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 4px var(--ink); }
.tr-dot:hover::before { border-color: var(--ink); }
.tr-dot:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.tr-dots { isolation: isolate; }

.tr-foot-btns { display: flex; gap: 8px; flex: 0 0 auto; }
.tr-foot .btn { min-height: 34px; }
.tr-foot .btn-icon { width: 34px; }
.tr-next { min-width: 104px; }

/* Küçültülmüş kart: yalnızca başlık + gezinme */
.tr-card.is-min .tr-body { display: none; }
.tr-card.is-min .tr-title { font-size: 19px; }

/* Masaüstü (≥ 1180): kart cihaz sütununun altına oturur; cihaz çerçevesi kartın üstünde kalacak kadar kısalır */
@media (min-width: 1180px) {
  html.tour-on .pane-device { display: flex; flex-direction: column; }
  /* #device-root aynı zamanda .dv-host: kartın alt boşluğu (12px) + kart + 12px nefes */
  html.tour-on #device-root { flex: 1 1 auto; min-height: 0; padding-bottom: calc(var(--tour-card-h, 0px) + 24px); }
  html.tour-on .dv-device { height: clamp(380px, 100%, 700px); transition: height var(--dur-3) var(--ease-out); }
}
/* Tablet (820–1179): cihaz sütunu kart için çok dar; kart altta geniş bir bant olur (metin solda, gezinme sağda),
 * ilk satır (cihaz + harita) bandın yüksekliği kadar kısalır, sayfa altına da aynı dolgu eklenir. */
@media (min-width: 820px) and (max-width: 1179.98px) {
  .tr-card {
    left: 12px;
    right: 12px;
    width: auto;
    max-height: 42vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto auto minmax(0, 1fr);
  }
  .tr-stripe { grid-column: 1 / -1; grid-row: 1; }
  .tr-head { grid-column: 1; grid-row: 2; }
  .tr-body { grid-column: 1; grid-row: 3; padding-bottom: 10px; }
  .tr-foot { grid-column: 2; grid-row: 2 / 4; flex-direction: column; align-items: flex-end; justify-content: flex-end; padding: 12px 14px 12px 8px; }
  .tr-foot .tr-dots { margin: 0 0 auto; order: -1; }
  html.tour-on body { padding-bottom: calc(var(--tour-card-h, 0px) + 16px); }
  html.tour-on .stage { grid-template-rows: clamp(400px, calc(100vh - 176px - var(--tour-card-h, 0px)), 880px) auto; }
  html.tour-on .dv-device { height: clamp(360px, 100%, 700px); }
}

/* Telefon: aksiyon çubuğunun üstünde alt sayfa (bottom sheet) */
@media (max-width: 819.98px) {
  .tr-card {
    left: 0;
    right: 0;
    bottom: calc(var(--actionbar-h) + env(safe-area-inset-bottom, 0px));
    width: auto;
    max-height: 46vh;
    border-width: 1px 0 0;
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.16);
    animation-name: tr-up;
  }
  @keyframes tr-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .tr-title { font-size: 21px; }
  .tr-head { padding-top: 10px; }
  .tr-iconbtn { width: var(--touch); height: var(--touch); }
  .tr-dot { width: 22px; height: var(--touch); }
  .tr-dot + .tr-dot::after { width: 22px; }
  .tr-foot { padding-bottom: 10px; }
  .tr-foot .btn { min-height: var(--touch); }
  .tr-prev .ct-btn-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); }
  html.tour-on body { padding-bottom: calc(var(--actionbar-h) + env(safe-area-inset-bottom, 0px) + var(--tour-card-h, 0px)); }
}
@media (max-width: 379.98px) {
  .tr-dot { width: 18px; }
  .tr-dot + .tr-dot::after { width: 18px; }
}

/* Hareket azaltma */
@media (prefers-reduced-motion: reduce) {
  .ct-next.is-waiting, .ct-narr-next.is-waiting { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
  .ct-chip.is-running::after { animation: none; transform: scaleX(1); }
}
:root[data-motion="reduce"] .ct-next.is-waiting,
:root[data-motion="reduce"] .ct-narr-next.is-waiting { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
:root[data-motion="reduce"] .ct-chip.is-running::after { animation: none; transform: scaleX(1); }

</style>

<script>window.SIM = window.SIM || {}; window.SIM.bundled = true;</script>
<script data-src="js/core.js">
/* core.js — [foundation] SIM.settings, SIM.setSetting, SIM.bus, SIM.util
 * Sözleşme: SPEC.md §4. Klasik script; ES module yok, harici kütüphane yok.
 * Node/VM içinde de yüklenebilir (testler için): window yoksa globalThis kullanılır.
 */
if (typeof window === 'undefined') { globalThis.window = globalThis; }
window.SIM = window.SIM || {};

(function (SIM) {
  'use strict';

  var hasDoc = typeof document !== 'undefined';
  var perfNow = (typeof performance !== 'undefined' && typeof performance.now === 'function')

  /* ==================================================================
   * SIM.bus — basit olay yolu
   * ================================================================== */
  var listeners = Object.create(null);
  var anyListeners = [];

  function report(evt, err) {
    try { console.error('[SIM.bus] "' + evt + '" dinleyicisi hata verdi:', err); } catch (e) { /* yut */ }

   * SIM.settings + SIM.setSetting

    stepMode: false,     // true iken her hop öncesi SIM.util.gate() "İleri" bekler
    ambient: true,       // arka plan trafiği

  SIM.settings = {};
  Object.keys(defaults).forEach(function (k) {

  });
  Object.keys(existing).forEach(function (k) {

    var sp = speedOf(s), pz = !!s.paused;
    var t = perfNow();

    if (sp !== clk.speed || pz !== clk.paused) {

    }
    return value;
  }
  function clockRebase() {
    var t = perfNow();
    clk.base = clk.paused ? clk.base : clk.base + (t - clk.t0) * clk.speed;
    clk.t0 = t;
  }

    if (!hasDoc || !document.documentElement) return;

      SIM.settings[key] = value;

   * SIM.util
   * ================================================================== */
  var util = {};

  var TICK_MAX = 40;      // ms; ayar değişikliklerine tepki süresi

   * stepMode kapalıysa hemen çözülür. Açıksa bus 'step:next' gelene kadar bekler.

  /** Ek: bekleyen tüm kapıları aç (bus 'step:next' ile aynı etki). */

  /** Ek: kısayol — bus.emit('step:next'). */

  bus.on('step:next', function () { releaseGates(); });
  bus.on('reset', function () { releaseGates(); });

  util.raf = function () {
    return new Promise(function (resolve) {
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(function (t) { resolve(t); });

  /* ---------- rastgelelik ---------- */
  util.clamp = function (x, a, b) {
    x = Number(x);
    if (a > b) { var t = a; a = b; b = t; }

  util.rand = function (a, b) {

    a = Math.ceil(a); b = Math.floor(b);

    return arr[Math.floor(Math.random() * arr.length)];

   * seeded(seed) -> () => [0,1)   (mulberry32). seed sayı veya metin olabilir.

  /** Durumu SIM.data'dan (yerinde) kurar. */
  function buildState() {
    var hem = G.demoHem || u.sha256HexSync(normEmail(D.demoUser.email));

      },

      },

      cleanroom: {
        epsilonBudget: D.partner.epsilonBudget, epsilonUsed: 0, epsilonPerRun: D.partner.epsilonPerRun,
        k: D.partner.k, minSegment: D.partner.minSegment, collaborationId: D.partner.collaborationId, runs: []
      },
      suppression: [],

    };
    Object.keys(S).forEach(function (k) { delete S[k]; });
    defineSimNow(S);
    Object.keys(st).forEach(function (k) { S[k] = st[k]; });
    G.supSet = {};
    G.acc = {};
    G.lastPacerSim = S.simNow;
    G.reportsDirty = false;
    return S;
  }

  /* ==================================================================
   * Rıza, kimlik, suppression
   * ================================================================== */
  function purposesFor(choice) {
    if (choice === 'all') return { storage: true, measurement: true, profiling: true, personalizedAds: true };
    if (choice === 'necessary') return { storage: true, measurement: false, profiling: false, personalizedAds: false };
    return { storage: false, measurement: false, profiling: false, personalizedAds: false };
  }
  function purposesBitmask(p) {
    if (!p) return 0;
    if (p.profiling && p.personalizedAds && p.measurement && p.storage) return 1023;
    var m = 0;
    if (p.storage) m |= 1;
    if (p.measurement) m |= 2 | 256;
    if (p.profiling) m |= 4 | 8;
    if (p.personalizedAds) m |= 16 | 32 | 64 | 128 | 512;
    return m;
  }
  function canProfile() {
    var c = S.consent;
    return !!(c && c.status === 'all' && c.purposes && c.purposes.profiling && c.kvkkExplicit);
  }
  function canPersonalize() { return canProfile() && !!S.consent.purposes.personalizedAds; }
  function canMeasureIdentity() { return !!(S.consent && S.consent.purposes && S.consent.purposes.measurement); }

  function makeTcString(choice, ts) {
    var r = u.seeded('tc:' + choice + ':' + ts);
    var A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    var s = 'CQ';
    for (var i = 0; i < 46; i++) s += A.charAt(Math.floor(r() * 64));
    return s + '.' + (choice === 'all' ? 'YAAAAAAAAAAA' : (choice === 'necessary' ? 'IAAAAAAA' : 'AAAA'));
  }

  function profileConsent(ts) {
    var c = S.consent;
    return {
      status: c.status, kanal: 'web', purposes: purposesBitmask(c.purposes), kvkkExplicit: !!c.kvkkExplicit,
      tcf: c.tcString ? u.shortHash(u.sha256HexSync(c.tcString)) : null, updated: ts
    };
  }

  function rebuildSupSet() {
    G.supSet = {};
    (S.suppression || []).forEach(function (h) { G.supSet[h] = 1; });
  }
  function addSuppression(h) {
    if (!h || G.supSet[h]) return false;
    S.suppression.push(h);
    G.supSet[h] = 1;
    return true;
  }
  function isSuppressedId(type, value) { return !!(value && G.supSet[hashOf(type, value)]); }
  /** Ziyaretçi suppression listesinde mi? (DSAR sonrası) */
  function isSuppressedUser() {
    var us = S.user;
    if (!us) return false;
    return !!(us.suppressed || isSuppressedId('fpc', us.fpc) || isSuppressedId('hem', us.hem));
  }

  /* ==================================================================
   * Kafka
   * ================================================================== */
  function publish(topic, key, value, f) {
    var t = D.topics[topic] || { partitions: 12, line: null, startOffset: 0 };
    var partition = u.hash32(String(key)) % t.partitions;
    var prev = S.kafka.offsets[topic];
    if (prev == null) prev = t.startOffset || 0;
    var offset = prev + 1;
    S.kafka.offsets[topic] = offset;
    var msg = {
      topic: topic, partition: partition, offset: offset, key: key, value: value, ts: syncNow(),
      line: t.line || null, flowId: f ? f.id : null
    };
    S.kafka.log.push(msg);
    if (S.kafka.log.length > MAX_LOG) S.kafka.log.splice(0, S.kafka.log.length - MAX_LOG);
    bus.emit('kafka', msg);
    emitState(['kafka']);
    refreshBadges(false);
    return msg;
  }

  function consentBlock() {
    var c = S.consent || {};
    return {
      tcf_string: c.tcString || '',
      gpp_string: c.tcString ? 'DBABMA~' + c.tcString.slice(2, 14) : '',
      purposes_bitmask: purposesBitmask(c.purposes),
      kvkk_explicit: !!c.kvkkExplicit,
      limit_ad_tracking: !(c.purposes && c.purposes.personalizedAds)
    };
  }
  function deviceRaw() { return { ua: UA, ip_truncated: IP_TRUNC }; }
  function deviceEnriched() {
    return { ua: UA, ip_truncated: IP_TRUNC, os: 'iOS', os_version: '18.1', device_type: 'mobile', country: 'TR', region: 'İstanbul', city: 'İstanbul' };
  }
  function browserIds(withHem) {
    var ids = [];
    if (S.user.fpc) ids.push({ type: 'fpc', value: S.user.fpc });
    if (withHem && S.user.hem) ids.push({ type: 'hem', value: S.user.hem });
    return ids;
  }

  /** 05-veri-modeli.md'deki EventEnvelope'a benzer JSON. */
  function envelope(o) {
    var now = syncNow();
    var cat = o.category && o.category !== 'anasayfa' ? o.category : null;
    var env = {
      event_id: o.eventId || uuid7(now),
      event_type: o.type,
      event_time: iso(now - (o.skewMs == null ? 85 : o.skewMs)),
      received_time: iso(now),
      tenant_id: TENANT,
      consent: consentBlock(),
      identity: { person_id: o.personId || '', ids: o.ids || [] },
      device: o.enriched ? deviceEnriched() : deviceRaw(),
      context: {
        site_or_bundle: D.site.domain,
        url: 'https://' + D.site.domain + (o.path || '/'),
        referrer: o.referrer || '',
        content_categories: cat ? [cat] : [],
        page_view_id: o.pageViewId || ''
      }
    };
    if (o.payloadKey) env[o.payloadKey] = o.payload || {};
    if (o.enriched) env.enrichment = { geo: 'İstanbul (GeoIP)', ua: 'iOS 18.1 · Safari · mobil', bot: false, consent_profiling: canProfile(), content_category: cat || '' };
    return env;
  }

  /* ==================================================================
   * Profil ve segmentler
   * ================================================================== */
  function activeSegIds(prof, now) {
    if (!prof || !prof.seg) return [];
    return Object.keys(prof.seg).filter(function (k) { return num(prof.seg[k]) > now; })
      .map(Number).sort(function (a, b) { return a - b; });
  }

  function newPersonId() {
    var id;
    do { id = u.uid('P'); } while (S.profiles[id] || id === SEED_PID);
    return id;
  }

  function newProfile(pid, now) {
    return {
      personId: pid, ids: {}, seg: {}, fcap: {},
      attrs: { sehir: 'İstanbul', cihaz: 'mobil', dil: 'tr' },
      consent: profileConsent(now), counters: {}, ver: 1, createdAt: now, updatedAt: now
    };
  }

  function touchProfile(prof, now) {
    prof.ver = (prof.ver || 0) + 1;
    prof.updatedAt = now;
  }

  /** fpc → person (yoksa oluşturur). Yalnızca profilleme rızası varken çağrılır. */
  function resolveFpc(now) {
    if (!S.user.fpc) S.user.fpc = randHex(16);
    var key = 'fpc:' + S.user.fpc;
    var pid = S.idmap[key];
    var created = false;
    if (!pid || !S.profiles[pid]) {
      pid = newPersonId();
      S.profiles[pid] = newProfile(pid, now);
      S.idmap[key] = pid;
      created = true;
    }
    S.profiles[pid].ids[key] = now;
    S.user.personId = pid;
    return { personId: pid, created: created, profile: S.profiles[pid] };
  }

  function pushCounter(prof, key, ts) {
    var arr = prof.counters[key] || (prof.counters[key] = []);
    arr.push(ts);
    if (arr.length > MAX_COUNTER) arr.splice(0, arr.length - MAX_COUNTER);
  }

  function applyEventToProfile(prof, ev, now) {
    if (ev.category && D.categoryLabels[ev.category] && (ev.type === 'page_view' || ev.type === 'product_view')) {
      pushCounter(prof, ev.category, now);
    }
    if (ev.type === 'add_to_cart' || ev.type === 'purchase' || ev.type === 'ad_click') pushCounter(prof, ev.type, now);
    if (S.user.fpc) prof.ids['fpc:' + S.user.fpc] = now;
    prof.consent = profileConsent(now);
    prof.lastSeen = now;
    touchProfile(prof, now);
  }

  function countWithin(counters, keys, since) {
    var n = 0;
    keys.forEach(function (k) { (counters[k] || []).forEach(function (ts) { if (ts > since) n++; }); });
    return n;
  }

  /** Gerçek zamanlı kural değerlendirme (SPEC §5.5): olay türü → kural indeksi; yalnızca ilgili kurallar. */
  function evaluateSegments(prof, evType, category, now) {
    var res = { added: [], removed: [], refreshed: [], checks: [] };
    if (!prof) return res;
    D.segments.forEach(function (seg) {
      var lg = seg.logic;
      if (!lg) return;
      var ok = false, n = null, min = null;
      if (lg.type === 'count') {
        if (lg.events.indexOf(evType) < 0 || lg.categories.indexOf(category) < 0) return;
        n = countWithin(prof.counters, lg.categories, now - lg.withinDays * DAY);
        min = lg.min;
        ok = n >= lg.min;
      } else if (lg.type === 'cart_abandon') {
        if (lg.events.indexOf(evType) < 0 && evType !== lg.without) return;
        var lastAdd = last(prof.counters.add_to_cart), lastBuy = last(prof.counters[lg.without]);
        ok = !!lastAdd && (!lastBuy || lastBuy < lastAdd);
      } else if (lg.type === 'event') {
        if (lg.events.indexOf(evType) < 0) return;
        n = countWithin(prof.counters, lg.events, now - lg.withinDays * DAY);
        min = lg.min;
        ok = n >= lg.min;
      } else {
        return;   // batch / crm / clean_room gerçek zamanlı değerlendirilmez
      }
      var member = num(prof.seg[seg.id]) > now;
      res.checks.push({ id: seg.id, ok: ok, n: n, min: min, member: member, type: lg.type });
      if (ok && !member) res.added.push(seg.id);
      else if (ok && member) res.refreshed.push(seg.id);
      else if (!ok && member) res.removed.push(seg.id);
    });
    return res;
  }

  function applySegChange(prof, res, now) {
    res.added.concat(res.refreshed).forEach(function (id) { prof.seg[id] = segExpiry(id, now); });
    res.removed.forEach(function (id) { delete prof.seg[id]; });
    res.added.forEach(function (id) { if (S.segments[id]) S.segments[id].estimate += 1; });
    res.removed.forEach(function (id) { if (S.segments[id]) S.segments[id].estimate = Math.max(0, S.segments[id].estimate - 1); });
    if (res.added.length || res.removed.length || res.refreshed.length) touchProfile(prof, now);
  }

  function segName(id) { var s = D.segmentById[id]; return s ? s.name : String(id); }

  function segExpiry(id, now) { var s = D.segmentById[id]; return now + ((s && s.ttlDays) || 30) * DAY; }

  function segChangeText(res, now) {
    var parts = [];
    res.added.forEach(function (id) {
      var s = D.segmentById[id];
      var c = null;
      res.checks.forEach(function (x) { if (x.id === id) c = x; });
      parts.push(id + ' “' + s.name + '” — ' + s.rule + (c && c.n != null ? ' (' + c.n + ')' : '') +
        ' ✓ → üyelik, bitiş ' + u.fmtDate(segExpiry(id, now)));
    });
    res.removed.forEach(function (id) { parts.push(id + ' “' + segName(id) + '” üyeliği düştü'); });
    if (parts.length) {
      return 'Segment Motoru: ' + parts.join('; ') + '. Theta sketch erişim tahmini güncellendi, dmp.segment_changes yayınlanıyor.';
    }
    if (res.refreshed.length) {
      return 'Segment Motoru: ' + res.refreshed.join(', ') + ' zaten üye — kural yeniden sağlandı, üyelik bitişi ' +
        u.fmtDate(segExpiry(res.refreshed[0], now)) + ' tarihine uzatıldı.';
    }
    if (res.checks.length) {
      return 'Segment Motoru: olay türü → kural indeksi; yalnızca ' + res.checks.map(function (c) {
        return c.id + (c.n != null ? ' (' + c.n + '/' + c.min + ')' : '');
      }).join(', ') + ' değerlendirildi — eşik altında, üyelik değişmedi.';
    }
    return 'Segment Motoru: bu olay türü için tetiklenen gerçek zamanlı kural yok; üyelik değişmedi.';
  }

  function emitSegChange(pid, added, removed, reason, f) {
    if (!added.length && !removed.length) return;
    bus.emit('segment:change', { personId: pid, added: added.slice(), removed: removed.slice() });
    var now = syncNow();
    var prof = S.profiles[pid];
    publish('dmp.segment_changes', TENANT + ':' + pid, {
      event_id: uuid7(now), event_time: iso(now), tenant_id: TENANT, person_id: pid,
      added: added.map(function (id) { return { segment_id: id, expire_at: prof && prof.seg[id] ? iso(prof.seg[id]) : null }; }),
      removed: removed.map(function (id) { return { segment_id: id }; }),
      reason: reason || 'realtime_rule', rule_engine: reason === 'clean_room' ? 'dcr' : 'flink'
    }, f);
  }

  function fcapCount(prof, li, now) {
    if (!prof || !li.fcap) return 0;
    var e = prof.fcap[String(li.id)];
    if (!e) return 0;
    if (now - e.windowStart >= li.fcap.windowH * HOUR) return 0;
    return e.count;
  }
  function incFcap(prof, li, now) {
    var k = String(li.id);
    var e = prof.fcap[k];
    var windowH = li.fcap ? li.fcap.windowH : 24;
    if (!e || now - e.windowStart >= windowH * HOUR) e = prof.fcap[k] = { count: 0, windowStart: now };
    e.count += 1;
    e.windowH = windowH;
    touchProfile(prof, now);
    return e.count;
  }

  /** Birleştirme: from → into (SPEC §6.6 login). */
  function mergeProfiles(from, into, now) {
    var a = S.profiles[from], b = S.profiles[into];
    var before = activeSegIds(a, now);
    var moved = Object.keys(a.ids);
    moved.forEach(function (k) { b.ids[k] = Math.max(num(b.ids[k]), num(a.ids[k])); });
    Object.keys(a.seg).forEach(function (k) { b.seg[k] = Math.max(num(b.seg[k]), num(a.seg[k])); });
    Object.keys(a.fcap).forEach(function (k) {
      var x = a.fcap[k], y = b.fcap[k];
      if (!y || x.windowStart > y.windowStart || x.count > y.count) b.fcap[k] = clone(x);
    });
    Object.keys(a.counters).forEach(function (k) {
      b.counters[k] = (b.counters[k] || []).concat(a.counters[k]).sort(function (p, q) { return p - q; }).slice(-MAX_COUNTER);
    });
    var devices = [];
    [b.attrs.cihaz, a.attrs.cihaz].concat(b.attrs.cihazlar || []).forEach(function (d) { if (d && devices.indexOf(d) < 0) devices.push(d); });
    var attrs = {};
    Object.keys(a.attrs).forEach(function (k) { attrs[k] = a.attrs[k]; });
    Object.keys(b.attrs).forEach(function (k) { attrs[k] = b.attrs[k]; });
    attrs.cihazlar = devices.map(function (d) { return d === 'mobil' ? 'mobil web' : d; });
    b.attrs = attrs;
    b.consent = clone(a.consent);             // en güncel rıza (web) geçerli
    b.ver = Math.max(num(a.ver), num(b.ver)) + 1;
    b.updatedAt = now;
    b.lastSeen = now;
    b.merged = (b.merged || []).concat([{ from: from, at: now }]);
    Object.keys(S.idmap).forEach(function (k) { if (S.idmap[k] === from) S.idmap[k] = into; });
    moved.forEach(function (k) { S.idmap[k] = into; });
    delete S.profiles[from];
    var after = activeSegIds(b, now);
    return { moved: moved, ids: Object.keys(b.ids), addedSegs: after.filter(function (id) { return before.indexOf(id) < 0; }) };
  }

  /* ==================================================================
   * Teslimat / pacing
   * ================================================================== */
  var flightCache = {};
  function flightOf(li) {
    if (!li.flight) return null;
    var k = li.id + '|' + li.flight.start + '|' + li.flight.end;
    if (!flightCache[k]) flightCache[k] = { start: parseTs(li.flight.start), end: parseTs(li.flight.end) };
    return flightCache[k];
  }
  /** Teslimat açığı: max(0, beklenen − teslim) / hedef, 0..0,5 aralığına kırpılır (gölge fiyat için). */
  function deliveryInfo(li, now) {
    if (!li || !li.goal || !li.goal.qty) return null;
    var fl = flightOf(li);
    if (!fl || !(fl.end > fl.start)) return null;
    var frac = clamp((now - fl.start) / (fl.end - fl.start), 0, 1);
    var expected = li.goal.qty * frac;
    var gap = expected - num(li.delivered);
    return {
      frac: frac, expected: Math.round(expected), delivered: num(li.delivered),
      error: gap / li.goal.qty,
      deficit: clamp(Math.max(0, gap) / li.goal.qty, 0, 0.5),
      ahead: Math.max(0, -gap) / li.goal.qty
    };
  }
  /** Bütçe temposu: harcanan / (bütçe × geçen uçuş oranı). 1 = planında. */
  function budgetPace(li, now) {
    var fl = flightOf(li);
    if (!li.budgetTL || !fl || !(fl.end > fl.start)) return null;
    var frac = clamp((now - fl.start) / (fl.end - fl.start), 0.0001, 1);
    return num(li.spentTL) / (li.budgetTL * frac);
  }
  /** PID benzeri oransal kontrol: taban throttle + Kp × hata (hedef eğrisinden sapma). */
  function pacerTarget(li, now, jitter) {
    var di = deliveryInfo(li, now);
    if (!di) return li.throttle;
    var base = num(li.baseThrottle, li.throttle);
    return round(clamp(base + 0.2 * di.error + (jitter || 0), 0.05, 1), 2);
  }

  /* ==================================================================
   * decide(ctx) — saf karar fonksiyonu (SPEC §6.5)
   * ================================================================== */
  function resolveSlot(slot) {
    if (slot && typeof slot === 'object') return { id: slot.id || 'mpu', size: slot.size || '300x250', floorCpm: num(slot.floorCpm, 30), code: slot.code || '' };
    var s = D.slots[slot] || D.slots.mpu;
    return { id: s.id, size: s.size, floorCpm: s.floorCpm, code: s.code };
  }

  function ecpmOf(li, pCtr, pCvr) {
    if (li.pricing === 'CPC') return num(li.rate) * pCtr * 1000;
    if (li.pricing === 'CPA') return num(li.rate) * pCtr * pCvr * 1000;
    return num(li.rate);
  }

  function rankOf(c) {
    if (c.status === 'won') return 0;
    if (c.status === 'lost' && c.type !== 'house') return 1;
    if (c.status === 'filtered') return 2;
    return 3;
  }

  /**
   * decide(ctx) -> trace
   * ctx: { requestId, impressionId?, slot:'mpu'|'home'|{…}, category, path, now?, consent?, personalized?, withIds?,
   *        personId?, profile?, segments? (profil yoksa), lineItems? (varsayılan SIM.state.lineItems), bidders? }
   * Aynı ctx + aynı durum → aynı sonuç (istek id'sinden tohumlanmış RNG). Durumu değiştirmez.
   */
  function decide(ctx) {
    ctx = ctx || {};
    var now = ctx.now != null ? num(ctx.now) : u.nowSim();
    var reqId = String(ctx.requestId || ctx.id || u.uid('req', 6));
    var rng = u.seeded('decide:' + reqId);
    var slot = resolveSlot(ctx.slot);
    var floor = slot.floorCpm;
    var category = ctx.category || 'anasayfa';
    var path = ctx.path || (category === 'anasayfa' ? '/' : '/' + category);
    var consent = ctx.consent || S.consent || { status: 'unknown', purposes: {} };
    var personalized = ctx.personalized != null ? !!ctx.personalized :
      !!(consent.status === 'all' && consent.purposes && consent.purposes.personalizedAds && ctx.personId);
    var profile = personalized ? (ctx.profile || null) : null;
    var personId = personalized ? (ctx.personId || (profile && profile.personId) || null) : null;
    var segs = profile ? activeSegIds(profile, now) : (personalized && Array.isArray(ctx.segments) ? ctx.segments.map(Number) : []);
    var withIds = ctx.withIds != null ? (!!ctx.withIds && personalized) : personalized;
    var lis = ctx.lineItems || S.lineItems || {};
    var list = Object.keys(lis).map(function (k) { return lis[k]; })
      .sort(function (a, b) { return (a.priority - b.priority) || (a.id - b.id); });

    /* ---- adaylar ---- */
    var candidates = [];
    var houseCand = null;
    list.forEach(function (li) {
      var t = li.targeting || {};
      var segT = t.segments || [], ctxT = t.contexts || [];
      var matched = segT.filter(function (s) { return segs.indexOf(s) >= 0; });
      var segMatch = matched.length > 0;
      var pCtr = round(num(li.baseCtr) * (segMatch ? 1.6 : 1), 6);
      var pCvr = round(num(li.baseCvr), 6);
      var c = {
        lineItemId: li.id, name: li.name, type: li.type, pricing: li.pricing, rate: num(li.rate), priority: li.priority,
        pCtr: pCtr, pCvr: pCvr, ecpm: 0, status: 'filtered', reason: '',
        segmentMatch: segMatch, matchedSegments: matched, throttle: num(li.throttle, 1)
      };
      var e = ecpmOf(li, pCtr, pCvr);
      if (li.type === 'standard') {
        var di = deliveryInfo(li, now);
        c.shadow = true;
        c.deficit = round(di ? di.deficit : 0, 4);
        e = e * (1 + c.deficit);
      }
      c.ecpm = round(e, 2);
      c.billingCpm = li.pricing === 'CPM' ? num(li.rate) : c.ecpm;

      if (li.type === 'house') {
        c.status = 'lost';
        c.reason = 'yalnızca doldurma (house)';
        if (li.status !== 'active') { c.status = 'filtered'; c.reason = 'durduruldu'; }
        houseCand = c;
        candidates.push(c);
        return;
      }
      candidates.push(c);
      if (li.status !== 'active') { c.reason = 'durduruldu'; return; }
      if (segT.length) {
        if (!personalized) { c.reason = 'rıza yok'; return; }
        if (!segMatch) { c.reason = 'hedefleme uymadı'; return; }
      } else if (t.requiresConsent && !personalized) { c.reason = 'rıza yok'; return; }
      if (ctxT.length && ctxT.indexOf(category) < 0) { c.reason = 'hedefleme uymadı'; return; }
      c.targeted = true;
      if (li.fcap && profile) {
        var n = fcapCount(profile, li, now);
        c.fcap = { count: n, max: li.fcap.max, windowH: li.fcap.windowH };
        if (n >= li.fcap.max) { c.reason = 'fcap ' + n + '/' + li.fcap.max; return; }
      }
      if (li.budgetTL != null && num(li.spentTL) >= num(li.budgetTL)) { c.reason = 'bütçe tükendi'; return; }
      var roll = u.hash32('pace:' + reqId + ':' + li.id) / 4294967296;
      c.pacingRoll = round(roll, 3);
      if (roll >= c.throttle) { c.reason = 'pacing throttle'; return; }
      if (c.billingCpm < floor) { c.reason = 'floor altı'; return; }
      c.status = 'eligible';
    });

    /* ---- header bidding (Prebid Server) ---- */
    var timeout = num(D.bidderTimeoutMs, 120);
    var bidders = ctx.bidders || D.bidders;
    var bids = bidders.map(function (b) {
      var latency = round(rng.range(b.latencyMs[0], b.latencyMs[1]), 0);
      var has = rng() < b.bidRate;
      var raw = rng.range(b.cpm[0], b.cpm[1]);
      var cpm = round(raw * (withIds ? b.idBoost : 1), 2);
      var bid = { bidder: b.id, name: b.name, cpm: null, latencyMs: latency, withIds: withIds, status: 'nobid', reason: 'teklif yok' };
      if (latency > timeout) {
        bid.status = 'timeout';
        bid.reason = 'zaman aşımı (> ' + timeout + ' ms)';
        if (has) bid.lateCpm = cpm;
        return bid;
      }
      if (!has) return bid;
      bid.cpm = cpm;
      if (cpm < floor) { bid.status = 'lost'; bid.reason = 'floor altı'; return bid; }
      bid.status = 'valid';
      bid.reason = '';
      return bid;
    });

    /* ---- birleşik açık artırma (first-price, floor) ---- */
    var pool = [];
    candidates.forEach(function (c) { if (c.status === 'eligible') pool.push({ kind: 'direct', c: c, ecpm: c.ecpm, prio: c.priority }); });
    bids.forEach(function (b) { if (b.status === 'valid') pool.push({ kind: 'prebid', b: b, ecpm: b.cpm, prio: 12 }); });
    pool.sort(function (x, y) { return (y.ecpm - x.ecpm) || (x.prio - y.prio); });
    var top = pool[0] || null;
    var winner;
    pool.forEach(function (p, i) {
      if (i === 0) return;
      if (p.kind === 'direct') { p.c.status = 'lost'; p.c.reason = 'daha düşük eCPM'; }
      else { p.b.status = 'lost'; p.b.reason = 'daha düşük teklif'; }
    });
    if (top && top.kind === 'direct') {
      top.c.status = 'won';
      top.c.reason = 'en yüksek eCPM';
      winner = { source: 'direct', lineItemId: top.c.lineItemId, bidder: null, priceCpm: round(top.c.billingCpm, 2), ecpm: top.c.ecpm,
        reason: top.c.shadow ? 'en yüksek eCPM (gölge fiyat)' : 'en yüksek eCPM' };
    } else if (top) {
      top.b.status = 'won';
      top.b.reason = 'en yüksek teklif';
      winner = { source: 'prebid', lineItemId: null, bidder: top.b.bidder, priceCpm: top.b.cpm, ecpm: top.b.cpm, reason: 'en yüksek teklif (first-price)' };
    } else if (houseCand && houseCand.status !== 'filtered') {
      houseCand.status = 'won';
      houseCand.reason = 'doldurma (house)';
