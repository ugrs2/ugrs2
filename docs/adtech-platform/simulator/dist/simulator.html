      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function applyFocus() {
    if (!st.svg) return;
    var set = st.focus;
    st.svg.classList.toggle('has-focus', !!set);
    var D = data();
    Object.keys(st.stationEls).forEach(function (id) { st.stationEls[id].classList.toggle('is-focus', !!(set && set[id])); });
    Object.keys(st.edgeEls).forEach(function (eid) {
      var e = D.edgeById[eid];
      st.edgeEls[eid].classList.toggle('is-focus', !!(set && e && set[e.from] && set[e.to]));
    });
    Object.keys(st.badgeEls).forEach(function (id) { st.badgeEls[id].classList.toggle('is-focus', !!(set && set[id])); });
    Object.keys(st.zoneEls).forEach(function (zid) {
      var any = false;
      if (set) D.nodes.forEach(function (n) { if (n.zone === zid && set[n.id]) any = true; });
      st.zoneEls[zid].classList.toggle('is-focus', any);
      if (st.zoneLabelEls && st.zoneLabelEls[zid]) st.zoneLabelEls[zid].classList.toggle('is-focus', any);
    });
  }

  function applyActiveLine() {
    var l = st.activeLine;
    var D = data();
    if (st.svg) {
      st.svg.classList.toggle('has-line', !!l);
      if (l) st.svg.setAttribute('data-active-line', l); else st.svg.removeAttribute('data-active-line');
      Object.keys(st.laneEls).forEach(function (eid) {
        var lanes = st.laneEls[eid];
        Object.keys(lanes).forEach(function (ln) { lanes[ln].classList.toggle('is-on', ln === l); });
        var lab = st.edgeLabelEls[eid];
        if (lab) lab.classList.toggle('is-on', !!(l && lanes[l]));
      });
      Object.keys(st.stationEls).forEach(function (id) {
        st.stationEls[id].classList.toggle('is-on', !!(l && D.linesOf(id).indexOf(l) >= 0));
      });
    }
    Object.keys(st.legendBtns).forEach(function (ln) {
      st.legendBtns[ln].setAttribute('aria-pressed', ln === l ? 'true' : 'false');
    });
    if (st.legend) st.legend.classList.toggle('has-line', !!l);
  }

  function applyPaused() {
    if (st.svg) st.svg.classList.toggle('is-paused', !!settings().paused);
  }

  /* ==================================================================
   * 9. Animasyon döngüsü (tek rAF, tüm paketler)
   * ================================================================== */
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  function kick() {
    if (!st.raf && typeof requestAnimationFrame === 'function') st.raf = requestAnimationFrame(frame);
    if (!st.watchdog) {
      st.watchdog = setInterval(function () {
        if (!st.items.length) { clearInterval(st.watchdog); st.watchdog = 0; return; }
        // rAF durmuşsa (gizli sekme) zamanlayıcıyla ilerlet
        if (perfNow() - st.lastFrame > 300) tick();
      }, 250);
    }
  }
  function frame() {
    st.raf = 0;
    st.lastFrame = perfNow();
    tick();
    if (st.items.length) st.raf = requestAnimationFrame(frame);
  }
  function tick() {
    var now = clock();
    var items = st.items;
    var keep = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var finished = false;
      try { finished = it.update(now); } catch (e) { finished = true; try { console.error('[SIM.diagram]', e); } catch (x) { /* yut */ } }
      if (finished) { try { it.finish(); } catch (e) { /* yut */ } } else keep.push(it);
    }
    // update sırasında eklenenler (ambient bir sonraki hop) korunur
    for (var j = items.length; j < st.items.length; j++) keep.push(st.items[j]);
    st.items = keep;
  }
  function addItem(it) { st.items.push(it); kick(); }

  function laneFor(edgeId, line, reversed) {
    var ge = st.geo && st.geo.edges[edgeId];
    if (!ge) return null;
    var lane = (line && ge.lanes[line]) || ge.center;
    var key = reversed ? 'rev' : 'fwd';
    if (!lane[key]) {
      var pts = reversed ? lane.pts.slice().reverse() : lane.pts;
      lane[key] = { pts: pts, d: reversed ? pathD(pts, CORNER_R) : lane.d };
    }
    return { d: lane[key].d, pts: lane[key].pts, laneEl: st.laneEls[edgeId] && st.laneEls[edgeId][line] };
  }

  function ghostRoute(from, to) {
    var a = st.geo.nodes[from], b = st.geo.nodes[to];
    var pts = [{ x: a.x, y: a.y }, { x: b.x, y: b.y }];
    return { d: pathD(pts, 0), pts: pts, laneEl: null, ghost: true };
  }

  function routeFor(from, to, line) {
    var D = data();
    var eb = D.edgeBetween ? D.edgeBetween(from, to) : null;
    if (eb && st.geo.edges[eb.edge.id]) {
      var useLine = line && eb.edge.lines.indexOf(line) >= 0 ? line : null;
      var r = laneFor(eb.edge.id, useLine || line, eb.reversed);
      if (!useLine) r = laneFor(eb.edge.id, null, eb.reversed);
      r.edgeId = eb.edge.id; r.line = useLine; r.reversed = eb.reversed;
      r.laneEl = useLine ? st.laneEls[eb.edge.id][useLine] : null;
      return r;
    }
    var g = ghostRoute(from, to);
    g.edgeId = null;
    return g;
  }

  function markLive(laneEl, delta) {
    if (!laneEl) return;
    var n = (laneEl._live || 0) + delta;
    laneEl._live = n < 0 ? 0 : n;
    laneEl.classList.toggle('is-live', laneEl._live > 0);
  }

  function truncate(s, max) {
    s = String(s == null ? '' : s);
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  /** Paket (etiketli hap) öğesi. */
  function makePacket(opts, resolve) {
    var D = data();
    var lineId = opts.line && D.lines[opts.line] ? opts.line : null;
    var it = {
      kind: 'packet', opts: opts, resolve: resolve, start: clock(), dur: 0, done: false,
      line: lineId, els: null, route: null, len: 0, path: null
    };
    it.bind = function () {
      var route = routeFor(opts.from, opts.to, lineId);
      if (!it.line) {
        var eb = D.edgeBetween ? D.edgeBetween(opts.from, opts.to) : null;
        it.line = eb ? eb.edge.lines[0] : 'control';
      }
      it.route = route;
      var size = opts.size === 'lg' ? 'lg' : (opts.size === 'sm' ? 'sm' : 'md');
      var fs = st.fonts.packet * (size === 'lg' ? 1.15 : size === 'sm' ? 0.88 : 1);
      var label = truncate(opts.label, size === 'lg' ? 20 : size === 'sm' ? 12 : 16);
      if (route.ghost) {
        it.ghostEl = mk('path', { class: 'dg-ghost', d: route.d, 'data-line': it.line }, st.layers.ghost);
      }
      var tA = mk('path', { class: 'dg-trail dg-trail-a', d: route.d, 'data-line': it.line, 'stroke-width': f1(LANE_W + 3.5) }, st.layers.trails);
      var tB = mk('path', { class: 'dg-trail dg-trail-b', d: route.d, 'data-line': it.line, 'stroke-width': f1(LANE_W + 2) }, st.layers.trails);
      var g = mk('g', { class: 'dg-pk dg-pk-' + size, 'data-line': it.line }, st.layers.packets);
      var hgt = fs * 1.65;
      it.hw = hgt * 0.32; it.hh = hgt / 2;
      if (label) {
        var w = label.length * fs * 0.6 + fs * 1.3;
        it.hw = w / 2;
        mk('rect', { class: 'dg-pk-bg', x: f1(-w / 2), y: f1(-hgt / 2), width: f1(w), height: f1(hgt), rx: f1(hgt / 2) }, g);
        mk('text', { class: 'dg-pk-tx', x: 0, y: f1(fs * 0.36), 'text-anchor': 'middle', 'font-size': f1(fs), text: label }, g);
      } else {
        mk('circle', { class: 'dg-pk-bg', r: f1(hgt * 0.32) }, g);
      }
      it.els = { g: g, tA: tA, tB: tB };
      it.path = tA;
      var len = 0;
      try { len = tA.getTotalLength(); } catch (e) { len = polyLen(route.pts); }
      if (!(len > 0)) len = polyLen(route.pts) || 1;
      it.len = len;
      if (!it.dur) it.dur = clampN(360 + len * 2.1, 450, 1100);
      tA.setAttribute('stroke-dasharray', '0 ' + f1(len * 2 + 10));
      tB.setAttribute('stroke-dasharray', '0 ' + f1(len * 2 + 10));
      markLive(route.laneEl, 1);
      it.update(clock());
    };
    it.unbind = function () {
      if (it.route) markLive(it.route.laneEl, -1);
      if (it.els) {
        ['g', 'tA', 'tB'].forEach(function (k) { var e = it.els[k]; if (e && e.parentNode) e.parentNode.removeChild(e); });
      }
      if (it.ghostEl && it.ghostEl.parentNode) it.ghostEl.parentNode.removeChild(it.ghostEl);
      it.els = null; it.ghostEl = null;
    };
    it.update = function (now) {
      var p = clampN((now - it.start) / it.dur, 0, 1);
      var e = easeInOut(p);
      var d = e * it.len;
      var pt;
      try { pt = it.path.getPointAtLength(d); } catch (x) { pt = { x: 0, y: 0 }; }
      // hap görünüm kutusunun dışına taşmasın (iz hat üzerinde kalır)
      var gw = st.geo ? st.geo.w : 1e9, gh = st.geo ? st.geo.h : 1e9;
      var px = clampN(pt.x, it.hw + 2, Math.max(it.hw + 2, gw - it.hw - 2));
      var py = clampN(pt.y, it.hh + 2, Math.max(it.hh + 2, gh - it.hh - 2));
      it.els.g.setAttribute('transform', 'translate(' + f1(px) + ' ' + f1(py) + ')');
      var big = it.len * 2 + 10;
      var la = Math.min(d, 46), lb = Math.min(d, 20);
      it.els.tA.setAttribute('stroke-dasharray', f1(la) + ' ' + f1(big));
      it.els.tA.setAttribute('stroke-dashoffset', f1(-(d - la)));
      it.els.tB.setAttribute('stroke-dasharray', f1(lb) + ' ' + f1(big));
      it.els.tB.setAttribute('stroke-dashoffset', f1(-(d - lb)));
      return p >= 1;
    };
    it.finish = function () {
      if (it.done) return;
      it.done = true;
      it.unbind();
      pulse(opts.to, { line: it.line });
      resolve();
    };
    it.abort = function () {
      if (it.done) return;
      it.done = true;
      it.unbind();
      resolve();
    };
    return it;
  }

  function travel(opts) {
    opts = opts || {};
    var D = data();
    if (!st.mounted || !st.geo || !hasDoc) return waitMs(450);
    if (!D || !D.nodeById[opts.from] || !D.nodeById[opts.to] || opts.from === opts.to) {
      if (D && D.nodeById[opts.to]) pulse(opts.to, { line: opts.line });
      return Promise.resolve();
    }
    if (isReduced()) return reducedTravel(opts);
    return new Promise(function (resolve) {
      var it = makePacket(opts, resolve);
      it.bind();
      addItem(it);
    });
  }

  function reducedTravel(opts) {
    var route = routeFor(opts.from, opts.to, opts.line);
    var el = route.laneEl, ghost = null;
    if (!el && route.edgeId) {
      // hat kenarda yoksa kenarın tüm şeritlerini vurgula
      var lanes = st.laneEls[route.edgeId] || {};
      var all = Object.keys(lanes).map(function (k) { return lanes[k]; });
      all.forEach(function (x) { x.classList.add('is-hot'); });
      return waitMs(300).then(function () {
        all.forEach(function (x) { x.classList.remove('is-hot'); });
        pulse(opts.to, { line: opts.line });
      });
    }
    if (!el) {
      ghost = mk('path', { class: 'dg-ghost is-hot', d: route.d, 'data-line': opts.line || 'control' }, st.layers.ghost);
    } else el.classList.add('is-hot');
    return waitMs(300).then(function () {
      if (el) el.classList.remove('is-hot');
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      pulse(opts.to, { line: opts.line });
    });
  }

  /** Ambient: soluk, etiketsiz noktalar ardışık kenarlarda sıçrar. */
  function ambient(opts) {
    if (!st.mounted || !st.geo || !hasDoc) return;
    opts = opts || {};
    var s = settings();
    if (s.paused || s.ambient === false || isReduced()) return;
    if (st.ambientCount >= AMBIENT_MAX) return;
    var path = (opts.path || []).filter(function (id) { return data().nodeById[id]; });
    if (path.length < 2) return;
    st.ambientCount++;
    var it = { kind: 'ambient', idx: 0, start: clock(), dur: 0, done: false, line: opts.line || null, el: null, path: null };
    it.bindHop = function () {
      var a = path[it.idx], b = path[it.idx + 1];
      var eb = data().edgeBetween(a, b);
      if (!eb) return false;
      var line = it.line && eb.edge.lines.indexOf(it.line) >= 0 ? it.line : eb.edge.lines[0];
      var r = laneFor(eb.edge.id, line, eb.reversed);
      if (!it.el) {
        it.el = mk('circle', { class: 'dg-amb', r: 2.6, 'data-line': line }, st.layers.trails);
      } else {
        it.el.setAttribute('data-line', line);
      }
      if (!it.path) it.path = mk('path', { class: 'dg-amb-path', d: r.d }, null);
      it.path.setAttribute('d', r.d);
      it.ptsLen = polyLen(r.pts);
      it.pts = r.pts;
      it.dur = clampN(520 + it.ptsLen * 3.2, 700, 1800);
      return true;
    };
    it.bind = function () {
      if (it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el);
      it.el = null;
      if (!it.bindHop()) it.done = true;
    };
    it.update = function (now) {
      if (it.done) return true;
      var p = (now - it.start) / it.dur;
      if (p >= 1) {
        it.idx++;
        if (it.idx >= path.length - 1) return true;
        it.start = now;
        if (!it.bindHop()) return true;
        p = 0;
      }
      var pt = pointAlong(it.pts, p * it.ptsLen);
      it.el.setAttribute('cx', f1(pt.x)); it.el.setAttribute('cy', f1(pt.y));
      return false;
    };
    it.finish = it.abort = function () {
      if (it.fin) return;
      it.fin = true; it.done = true;
      st.ambientCount = Math.max(0, st.ambientCount - 1);
      if (it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el);
    };
    it.unbind = function () { if (it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el); it.el = null; };
    if (!it.bindHop()) { it.finish(); return; }
    addItem(it);
  }

  /** Çoklu çizgi üzerinde mesafe d'deki nokta (köşeler düz; ambient için yeterli). */
  function pointAlong(pts, d) {
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var l = dist(pts[i - 1], pts[i]);
      if (acc + l >= d) return lerp(pts[i - 1], pts[i], l > 0 ? (d - acc) / l : 0);
      acc += l;
    }
    return pts[pts.length - 1];
  }

  function rebindItems() {
    st.items.forEach(function (it) {
      if (it.done) return;
      if (it.kind === 'packet') { it.els = null; it.ghostEl = null; it.route = null; it.bind(); }
      else { it.el = null; it.path = null; if (!it.bindHop()) it.done = true; }
    });
  }

  function clearItems(kind) {
    var keep = [];
    st.items.forEach(function (it) {
      if (!kind || it.kind === kind) { try { it.abort(); } catch (e) { /* yut */ } }
      else keep.push(it);
    });
    st.items = keep;
  }

  /* ==================================================================
   * 10. Etkileşim
   * ================================================================== */
  function activate(nodeId) {
    select(nodeId);
    try { SIM.bus && SIM.bus.emit('node:select', { nodeId: nodeId }); } catch (e) { /* yut */ }
  }
  function onStationClick(ev) {
    var id = ev.currentTarget.getAttribute('data-node');
    if (id) activate(id);
  }
  function onStationKey(ev) {
    var k = ev.key;
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      ev.preventDefault();
      ev.stopPropagation();
      var id = ev.currentTarget.getAttribute('data-node');
      if (id) activate(id);
    }
  }

  function select(nodeId) {
    var D = data();
    st.selected = nodeId && D && D.nodeById[nodeId] ? nodeId : null;
    applySelected();
  }
  function focus(ids) {
    if (!ids || (Array.isArray(ids) && !ids.length)) st.focus = null;
    else {
      var set = {};
      (Array.isArray(ids) ? ids : [ids]).forEach(function (id) { set[id] = true; });
      st.focus = set;
    }
    applyFocus();
  }
  function setActiveLine(lineId) {
    var D = data();
    var next = lineId && D && D.lines[lineId] ? lineId : null;
    var changed = next !== st.activeLine;
    st.activeLine = next;
    applyActiveLine();
    if (changed) { try { SIM.bus && SIM.bus.emit('diagram:line', { lineId: next }); } catch (e) { /* yut */ } }
  }
  function badge(nodeId, text) {
    if (!nodeId) return;
    if (text == null || text === '') delete st.badges[nodeId];
    else st.badges[nodeId] = String(text);
    if (st.mounted) drawBadge(nodeId);
  }

  /* ==================================================================
   * 11. Lejant
   * ================================================================== */
  var SHORT = { dmp: 'Veri', ad: 'Reklam', measure: 'Ölçüm', cleanroom: 'Clean Room', privacy: 'Rıza', control: 'Kontrol' };
  function renderLegend() {
    var el = st.legend;
    if (!el) return;
    var D = data();
    while (el.firstChild) el.removeChild(el.firstChild);
    el.classList.add('dg-legend');
    st.legendBtns = {};
    var list = h('div', { class: 'dg-legend-lines', role: 'group', 'aria-label': 'Hatlar: vurgulamak için seçin' });
    lineOrder().forEach(function (lid) {
      var L = D.lines[lid];
      if (!L) return;
      var b = h('button', {
        type: 'button', class: 'dg-legend-btn', 'data-line': lid, 'aria-pressed': 'false',
        title: L.code + ' · ' + L.name + ' — ' + L.desc,
        onclick: function () { setActiveLine(st.activeLine === lid ? null : lid); }
      }, [
        h('span', { class: 'line-badge sm', 'aria-hidden': 'true', text: L.code }),
        h('span', { class: 'dg-legend-name' }, [
          h('span', { class: 'dg-full', text: L.name }),
          h('span', { class: 'dg-short', 'aria-hidden': 'true', text: SHORT[lid] || L.name })
        ])
      ]);
      st.legendBtns[lid] = b;
      list.appendChild(b);
    });
    el.appendChild(list);
    var keys = h('div', { class: 'dg-legend-keys', 'aria-hidden': 'true' }, [
      h('span', { class: 'dg-key' }, [keySvg('hub'), 'aktarma']),
      h('span', { class: 'dg-key' }, [keySvg('ext'), 'dış sistem']),
      h('span', { class: 'dg-key dg-key-hint', text: 'İstasyona dokunun: ayrıntı' })
    ]);
    el.appendChild(keys);
    applyActiveLine();
  }
  function keySvg(kind) {
    var s = mk('svg', { class: 'dg-key-ico', viewBox: '-10 -10 20 20', width: 16, height: 16, 'aria-hidden': 'true', focusable: 'false' });
    if (kind === 'hub') { mk('circle', { r: 6.5, class: 'k-hub' }, s); mk('circle', { r: 2, class: 'k-core' }, s); }
    else mk('circle', { r: 6, class: 'k-ext' }, s);
    return s;
  }

  /* ==================================================================
   * 12. Yerleşim seçimi ve yeniden ölçekleme
   * ================================================================== */
  function chooseLayout(W, H, flow) {
    if (flow) return W >= 900 ? 'wide' : (W >= 560 ? 'square' : 'tall');
    var a = W / Math.max(1, H);
    return a >= 1.25 ? 'wide' : (a >= 0.8 ? 'square' : 'tall');
  }

  function doLayout(force) {
    if (!st.root || !st.stage) return;
    var W = st.root.clientWidth;
    if (W < 40) return;      // gizli: görünür olunca ResizeObserver yeniden çağırır
    st.root.style.height = '';
    st.stage.classList.add('is-fit');
    var H = st.root.clientHeight;
    var flow = H < 120;
    var id = chooseLayout(W, H, flow);
    var L = LAYOUTS[id];
    var vb = layoutSize(L);
    var s;
    if (flow) {
      s = W / vb.w;
      st.root.style.height = Math.ceil(W * vb.h / vb.w + FLOW_PAD) + 'px';
      st.stage.classList.remove('is-fit');
    } else {
      // sahne kökün içinde FIT_INSET kadar içeride
      s = Math.min((W - FIT_INSET[0]) / vb.w, (H - FIT_INSET[1]) / vb.h);
      st.root.style.height = '';
    }
    st.flow = flow;
    st.root.classList.toggle('dg-flow', flow);
    st.root.setAttribute('data-layout', id);
    var F = fontsFor(L, s);
    var key = id + '|' + F.label + '|' + F.sub + '|' + F.hideSub + '|' + F.packet;
    if (force || key !== st.renderKey || !st.svg) {
      st.renderKey = key;
      render(L, s);
    }
  }

  function layoutSize(L) {
    if (L._size) return L._size;
    var maxC = 0, maxR = 0;
    Object.keys(L.n).forEach(function (k) { maxC = Math.max(maxC, L.n[k][0]); maxR = Math.max(maxR, L.n[k][1]); });
    L._size = L.vb ? { w: L.vb[0], h: L.vb[1] } : {
      w: L.margin[3] + maxC * L.cell[0] + L.margin[1],
      h: L.margin[0] + maxR * L.cell[1] + L.margin[2]
    };
    return L._size;
  }

  function scheduleLayout() {
    if (st.layoutRaf) return;
    var run = function () { st.layoutRaf = 0; doLayout(false); };
    st.layoutRaf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame(run) : setTimeout(run, 16);
  }

  /* ==================================================================
   * 13. mount
   * ================================================================== */
  function mount(rootEl, legendEl) {
    if (!hasDoc) return;
    if (typeof rootEl === 'string') rootEl = document.querySelector(rootEl);
    if (typeof legendEl === 'string') legendEl = document.querySelector(legendEl);
    rootEl = rootEl || document.getElementById('diagram-root');
    legendEl = legendEl === undefined ? document.getElementById('map-legend') : legendEl;
    if (!rootEl || !data()) { warn('mount: kök öğe veya SIM.data yok'); return; }
    if (st.ro) { try { st.ro.disconnect(); } catch (e) { /* yut */ } }
    st.root = rootEl;
    st.legend = legendEl || null;
    while (rootEl.firstChild) rootEl.removeChild(rootEl.firstChild);
    rootEl.classList.add('dg-root');
    st.stage = h('div', { class: 'dg-stage is-fit' });

   * mode: 'center' (öğeyi ortala) | 'nearest' (en az kaydırma). Kaydırma yaptıysa true.
   */
  function revealEl(el, mode) {
    var vp = S.el.viewport;
    if (!vp || !el || !vp.contains(el)) return false;
    var vr = vp.getBoundingClientRect(), er = el.getBoundingClientRect();
    var mast = S.el.site.querySelector('.dv-mast');
    var top = (mast ? mast.offsetHeight : 0) + 8;
    if (er.top >= vr.top + top && er.bottom <= vr.bottom - 8) return false;
    var free = vr.height - top;
    var target;
    if (er.height >= free - 16) target = vp.scrollTop + (er.top - vr.top) - top;
    else if (mode === 'center') target = vp.scrollTop + (er.top - vr.top) - (top + (free - er.height) / 2);
    else if (er.top < vr.top + top) target = vp.scrollTop + (er.top - vr.top) - top - 4;
    else target = vp.scrollTop + (er.bottom - vr.bottom) + 14;
    target = Math.max(0, Math.min(target, vp.scrollHeight - vp.clientHeight));
    S.scrollGoal = { top: target, until: Date.now() + 900 };
    vp.scrollTo({ top: target, behavior: reduced() ? 'auto' : 'smooth' });
    return true;

  /** API ile tetiklenen aksiyonlarda "parmak" dokunuşu: hedef öğe görünür yapılır ve bir dalga çizilir. */

    var run = function () {
      if (!el.isConnected) return;
      el.classList.add('is-tapped');
      setTimeout(function () { el.classList.remove('is-tapped'); }, 280);
      if (reduced()) return;

      if (!er.width) return;

      setTimeout(function () { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 700);

    var lr = E.layer.getBoundingClientRect();
    var src = fromEl && fromEl.isConnected ? fromEl.getBoundingClientRect() : E.viewport.getBoundingClientRect();
    var dst = E.cartTab.querySelector('.dv-tab-ico').getBoundingClientRect();
    if (!src.width || !dst.width) return;
    var x0 = src.left + src.width / 2 - lr.left, y0 = src.top + src.height / 2 - lr.top;

   * Gezinme ve aksiyonlar
   * ================================================================== */

    if (r.page !== 'privacy') S.dsarUi.confirm = false;
    if (r.page !== 'cart') S.cartUi.msg = null;

    S.scrollGoal = null;

    refreshChrome();
    announce((PAGE_NAME[r.page] || '') + ' sayfası açıldı: ' + D.site.domain + routeInfo(r).path);
    if (!how.dispatch) return Promise.resolve([]);
    return dispatchAll(actionsFor(routeInfo(r)));

  function doGo(page, opts, src) {
    opts = opts || {};

      try { console.warn('[SIM.device] bilinmeyen sayfa:', page); } catch (e) { /* yut */ }
      return Promise.resolve([]);
    }
    var silent = !!opts.silent;
    if (!silent && src !== 'engine') emitDeviceAction(page === 'product' ? 'product_view' : 'page_view', page);
    return navigate(page, opts, { dispatch: !silent, push: !opts.replace });
  }
  function uiGo(page, opts) { return doGo(page, opts, 'ui'); }

  function onBack() {
    if (!S.history.length) return;
    var prev = S.history.pop();
    emitDeviceAction(prev.page === 'product' ? 'product_view' : 'page_view', prev.page);
    navigate(prev.page, prev, { dispatch: true, push: false });
  }
  function onReload() {
    var r = S.route;
    emitDeviceAction(r.page === 'product' ? 'product_view' : 'page_view', r.page);
    navigate(r.page, r, { dispatch: true, push: false });
  }

  function doConsent(choice, src) {
    if (!CHOICES[choice]) {
      try { console.warn('[SIM.device] geçersiz rıza seçimi:', choice, '→ all'); } catch (e) { /* yut */ }
      choice = 'all';
    }
    emitDeviceAction('consent');
    if (S.mounted && S.banner.open && S.el.bannerNodes) {
      var b = S.el.bannerNodes[1].querySelector('[data-choice="' + choice + '"]');
      if (b) {
        b.classList.add('is-chosen');
        if (src === 'api') tapFx(b);
      }
      setTimeout(closeBanner, reduced() ? 0 : (src === 'api' ? 420 : 160));
    } else {
      S.banner.open = false;
    }
    var info = routeInfo(S.route);
    if (info.slot && S.slots[info.slot]) { S.slots[info.slot] = { status: 'idle', ad: null }; renderSlot(info.slot, false); }
    var list = [dispatch({ type: 'consent', choice: choice })].concat(actionsFor(info).map(dispatch));
    return Promise.all(list).then(function (res) { return res[0]; });
  }

  function doLogin(email, src) {
    email = (email == null || String(email).trim() === '') ? D.demoUser.email : String(email).trim();
    emitDeviceAction('login');
    if (S.mounted && S.route.page !== 'login') navigate('login', {}, { dispatch: false, push: true });
    var L = S.loginUi;
    L.phase = 'working'; L.email = email; L.localHash = null; L.revealed = false; L.error = null; L.draft = email;
    if (S.mounted) {
      renderPage({ keepScroll: true });
      if (src === 'api') tapFx(S.el.page.querySelector('.dv-login-submit'));
    }
    U.sha256Hex(email.toLowerCase()).then(function (hex) {
      if (S.loginUi.email !== email || S.loginUi.phase !== 'working') return;
      S.loginUi.localHash = hex;
      scheduleRefresh();

    return dispatch({ type: 'login', email: email }).then(function (res) {
      if (S.loginUi.email === email) S.loginUi.phase = 'idle';
      scheduleRefresh();

      return res;
    });
  }

  function doAddToCart(sku, src) {
    if (!sku) sku = (S.route.page === 'product' ? S.route.sku : null) || (D.products[0] && D.products[0].sku);
    var p = D.productBySku[sku];
    if (!p) {
      try { console.warn('[SIM.device] bilinmeyen ürün:', sku); } catch (e) { /* yut */ }
      return Promise.resolve({ ok: false, reason: 'bilinmeyen ürün' });
    }
    emitDeviceAction('add_to_cart');
    var action = { type: 'add_to_cart', sku: p.sku };
    var opt = { sku: p.sku, action: action };
    S.optimistic.push(opt);
    if (S.mounted) {
      var onPage = S.route.page === 'product' && S.route.sku === p.sku;
      var buyBtn = onPage ? S.el.page.querySelector('.dv-buy') : null;
      if (buyBtn && src === 'api') tapFx(buyBtn);
      flyToCart(buyBtn);
      S.productUi = { added: p.sku, t: Date.now() };
      refreshChrome();
      if (S.route.page === 'product' || S.route.page === 'cart') renderPage({ keepScroll: true });
      setTimeout(function () { if (S.productUi.added === p.sku) scheduleRefresh(); }, 1900);
      toast('Sepete eklendi', p.name);
    }

      removeOptimistic(opt);
      scheduleRefresh();
      return res;
    });
  }
  function removeOptimistic(opt) {
    var i = S.optimistic.indexOf(opt);
    if (i >= 0) S.optimistic.splice(i, 1);
  }

  function doPurchase(src) {
    emitDeviceAction('purchase');

    var btnEl = S.mounted ? S.el.page.querySelector('.dv-checkout') : null;
    if (btnEl && src === 'api') tapFx(btnEl);

  function doClickAd(src, el) {
    emitDeviceAction('ad_click');
    var slotId = SLOT_OF_PAGE[S.route.page];
    var adEl = el || (slotId && S.mounted ? S.el.page.querySelector('.dv-ad[data-slot="' + slotId + '"] .dv-ad-click') : null);

    S.collectors.push(col);
    return dispatch({ type: 'ad_click' }).then(function (res) {

  function doDsar(src) {

    if (S.mounted) {
      renderPage({ keepScroll: true });
      var b = S.el.page.querySelector('.dv-dsar-btn');
      if (b && src === 'api') tapFx(b); else revealEl(S.el.page.querySelector('.dv-data-card'), 'nearest');
    }
    return dispatch({ type: 'dsar_delete' }).then(function (res) {
      S.dsarUi = { phase: 'idle', confirm: false };
      if (S.mounted) {
        if (S.route.page === 'privacy') renderPage({ keepScroll: true });
        refreshChrome();
        if (res && res.ok) toast('Verileriniz silindi', DSAR_ORDER.length + '/' + DSAR_ORDER.length + ' depo · talep ' + ((res.dsar && res.dsar.id) || ''));

    });

  /* ==================================================================
   * Motor olayları
   * ================================================================== */
  function onAdLoading(p) {
    if (!p || !S.slots[p.slot]) return;
    S.slots[p.slot] = { status: 'loading', ad: null };

      if (unit && !S.userScrolled) revealEl(unit, 'nearest');
    }
  }
  function onAdRendered(p) {
    if (!p || !S.slots[p.slot]) return;
    S.slots[p.slot] = { status: 'rendered', ad: p };

      var unit = renderSlot(p.slot, true);
      if (unit && !S.userScrolled) revealEl(unit, 'nearest');
    }
  }
  function onNavigate(p) {
    if (!p || !PAGES_OK[p.page]) return;
    var prom = doGo(p.page, { articleId: p.articleId, sku: p.sku }, 'engine');
    S.collectors.forEach(function (c) { c.push(prom); });
  }

  function onState(p) {
    var keys = (p && p.keys) || [];
    var hit = false;
    for (var i = 0; i < keys.length; i++) if (STATE_KEYS[keys[i]]) { hit = true; break; }
    if (!hit) return;

  }

    var a = p && p.action;

    if (idx < 0) for (var j = 0; j < S.optimistic.length; j++) { if (S.optimistic[j].sku === a.sku) { idx = j; break; } }
    if (idx >= 0) S.optimistic.splice(idx, 1);

  }

    S.collectors = [];

    S.cartUi = { phase: 'idle', msg: null };
    S.dsarUi = { phase: 'idle', confirm: false };
    S.productUi = { added: null, t: 0 };
    if (S.mounted) {
      if (S.sheet) closeSheet();
      clearToast();
      renderPage({});
      refreshChrome();
      openBanner('initial', false);

    }

  }

  function tickClock() {
    if (!S.mounted) return;

  }

  /* ==================================================================
   * Genel API
   * ================================================================== */
  function mount(rootEl) {
    U = SIM.util; D = SIM.data; bus = SIM.bus;
    if (!U || !D || !bus) { console.error('[SIM.device] core.js / data.js yüklenmemiş.'); return; }
    rootEl = rootEl || document.getElementById('device-root');
    if (!rootEl) { console.error('[SIM.device] mount: kök öğe yok.'); return; }
    if (S.mounted) unmount();
    S.root = rootEl;
    S.el = {};
    U.clear(rootEl);
    build(rootEl);
    S.mounted = true;

    S.unsub.push(bus.on('ad:loading', onAdLoading));
    S.unsub.push(bus.on('ad:rendered', onAdRendered));
    S.unsub.push(bus.on('device:navigate', onNavigate));
    S.unsub.push(bus.on('state', onState));
    S.unsub.push(bus.on('reset', onReset));
    S.unsub.push(bus.on('busy', onBusy));
    S.unsub.push(bus.on('flow:start', onFlowStart));
    var timer = setInterval(tickClock, 1000);
    S.unsub.push(function () { clearInterval(timer); });

    renderPage({});
    refreshChrome();
    tickClock();
    var e = engine();
    if (e && typeof e.isBusy === 'function') onBusy({ busy: e.isBusy() });

    if (!S.visitSent) {
      S.visitSent = true;
      if (consentState().status === 'unknown') {
        openBanner('initial', false);
        dispatch({ type: 'visit' });
      } else {
        dispatch({ type: 'visit' });
        dispatchAll(actionsFor(routeInfo(S.route)));
      }
    } else if (S.banner.open) {
      openBanner(S.banner.mode, false);
    }
  }

  function unmount() {
    S.unsub.forEach(function (fn) { try { fn(); } catch (e) { /* yut */ } });
    S.unsub = [];
    if (S.ro) { try { S.ro.disconnect(); } catch (e) { /* yut */ } S.ro = null; }
    clearTimeout(S.toastT);
    clearTimeout(S.refreshT); S.refreshT = 0;
    S.urlTok++;
    if (S.root) { U.clear(S.root); S.root.classList.remove('dv-host'); }
    S.mounted = false;
    S.sheet = null;
  }

  SIM.device = {
    mount: mount,
    /** go(page, {articleId}|{sku}) → page_view/product_view (+ ad_request) dispatch eder. Ek: {silent:true} yalnızca gezinir. */
    go: function (page, opts) { return doGo(page, opts, 'api'); },
    acceptConsent: function (choice) { return doConsent(choice || 'all', 'api'); },
    login: function (email) { return doLogin(email, 'api'); },
    addToCart: function (sku) { return doAddToCart(sku, 'api'); },
    purchase: function () { return doPurchase('api'); },
    clickAd: function () { return doClickAd('api', null); },
    requestDsar: function () { return doDsar('api'); },
    // Ekler
    openConsent: function () { openBanner('reopen', false); },
    route: function () { var r = S.route; var info = routeInfo(r); return { page: r.page, articleId: r.articleId || null, sku: r.sku || null, path: info.path, slot: info.slot }; },
    isBannerOpen: function () { return !!S.banner.open; },
    unmount: unmount,
    _internal: { buildCreative: function (ad, slotId) { return buildCreative(ad, slotId); }, slots: function () { return S.slots; }, state: S }
  };
})(window.SIM);

</script>

  var MAX_NARR = 200, MAX_KAFKA = 150, MAX_DEC = 20;
  var MIN_INTERVAL = 200;          // ms — sekme başına en fazla ~5 çizim/sn
  var FLASH_MS = 2000;             // değişen profil alanlarının vurgu süresi
  var MERGE_ANIM_MS = 1500;

  var KIND_LABEL = { info: 'bilgi', ok: 'tamam', warn: 'uyarı', drop: 'atıldı' };
  var STORE_LABEL = { profile: 'Profil (Aerospike)', idmap: 'idmap', iceberg: 'Iceberg', clickhouse: 'ClickHouse', cleanroom: 'Clean room', partners: 'Aktivasyon ortakları' };
  var PURPOSE_LABEL = { kampanya_olcumleme_ve_aktivasyon: 'Kampanya ölçümleme ve aktivasyon' };
  var TEMPLATE_LABEL = { overlap_report: 'örtüşme raporu', audience_activation: 'kitle aktivasyonu' };
  var ID_ORDER = { fpc: 0, hem: 1, maid: 2 };

  /* ==================================================================
   * Küçük yardımcılar
   * ================================================================== */
  function D() { return SIM.data || {}; }

    else if (k === 'ArrowLeft' || k === 'ArrowUp') next = (cur - 1 + ids.length) % ids.length;

    if (!M.mounted) { M.active = tabId; return; }
    var prev = M.active;
    if (tabId !== prev) {

      TABS.forEach(function (t) {
        var on = t.id === tabId;
        var b = M.tabBtns[t.id];

      M.active = tabId;
    }
    M.unread[tabId] = false;
    paintDot(tabId);
    if (M.dirty[tabId] || tabId !== prev) renderNow(tabId);
    if (tabId !== prev) {
      restoreScroll(tabId);

    var l = b.offsetLeft - 16, r = b.offsetLeft + b.offsetWidth + 16;
    var target = null;
    if (l < row.scrollLeft) target = l;
    else if (r > row.scrollLeft + row.clientWidth) target = r - row.clientWidth;
    if (target == null) return;
    try { row.scrollTo({ left: Math.max(0, target), behavior: reducedMotion() ? 'auto' : 'smooth' }); }
    catch (e) { row.scrollLeft = Math.max(0, target); }

  /* ==================================================================

      if (!alive[id]) { var n = ui.items[id]; if (n.parentNode) n.parentNode.removeChild(n); delete ui.items[id]; }
    });

    // Gruplar: akış başlangıç sırasına göre (en yeni üstte)

    var withEntries = {};
    M.narr.forEach(function (e) { withEntries[e.flowId || '∅'] = true; });
    flowIds.forEach(function (fid) {
      var f = M.flows[fid];
      if (withEntries[fid] || !f.ended) ensureGroup(ui, fid);
    });

    // Yeni adımlar (eskiden yeniye işlenir; her biri grubunun başına eklenir)
    M.narr.forEach(function (e) {
      if (ui.items[e.id]) return;
      var g = ensureGroup(ui, e.flowId || '∅');
      var item = flowItem(e, anim);
      g.list.insertBefore(item, g.list.firstChild);
      ui.items[e.id] = item;
      g.count++;

    // Boşalan ve bitmiş grupları temizle, başlıkları güncelle
    keysOf(ui.groups).forEach(function (gid) {
      var g = ui.groups[gid];

      g.count = g.list.children.length;
      if (!g.count && (!f || f.ended)) {
        if (g.root.parentNode) g.root.parentNode.removeChild(g.root);
        delete ui.groups[gid];

    var total = M.narr.length, nGroups = keysOf(ui.groups).length;
    ui.empty.hidden = total > 0 || nGroups > 0;
    ui.lead.hidden = !ui.empty.hidden;
    ui.meta.textContent = total ? fInt(total) + ' adım · ' + fInt(nGroups) + ' akış' : '';

  function kafkaSummary(v) {

  function buildKafkaValue(d) {

    var ROW = 40;
    var H = Math.max(124, (n - 1) * ROW + 68);
    var W = 340;
    var cy = H / 2;
    var top = cy - (n - 1) * ROW / 2;
    var capX = 8, capW = 84, capH = 30;
    var trunkX = 114, nodeX = 142;
    var animate = false, elapsed = 0;
    if (merge && !reducedMotion()) {
      if (merge.shownAt == null && perf() - merge.at < 20000) merge.shownAt = perf();

    }

          ' V' + (y - sgn * r) + ' Q' + trunkX + ' ' + y + ' ' + (trunkX + r) + ' ' + y + ' H' + (nodeX - 7);

        sv('text', { x: nodeX + 14, y: y + 12, class: 'ins-idg-val' }, shown));

    svg.appendChild(gEdges);

    if (animate) {
      ghost = sv('g', { class: 'ins-idg-ghost' },
