<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ses Paketi — Dinleme Sayfası</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #2a231d; --card: #211b16; --pill: #3a3029; --pill-h: #4c4037; --text: #f4ead9; --muted: #b5a690; --gold: #f1c45c; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; padding: 18px; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
      .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .bar label { font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; }
      #prog { color: var(--gold); font-weight: 900; }
      section { background: var(--card); border: 2px solid rgba(241, 196, 92, 0.25); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
      h2 { margin: 0 0 10px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
      .grid { display: flex; flex-wrap: wrap; gap: 8px; }
      button { background: var(--pill); color: var(--text); border: 0; border-radius: 11px; padding: 7px 11px; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; text-align: left; }
      button:hover { background: var(--pill-h); }
      button.playing { box-shadow: inset 0 0 0 2px var(--gold); }
      button small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
      button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15); font-size: 12px; padding: 4px 9px; }
      .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
      .skills div { background: var(--pill); border-radius: 11px; padding: 8px 10px; font-weight: 800; }
      audio { width: 100%; height: 32px; margin-top: 6px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <h1>🔊 Ses Paketi</h1>
    <p class="sub">Hiçbir ses dosyası yüklenmiyor: aşağıdaki sesler bu sayfada matematikle üretiliyor. Her tıklamada farklı bir varyasyon çalar.</p>
    <div class="bar">
      <span id="prog">Sesler üretiliyor…</span>
      <label>Ses <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      <button class="ghost" id="stop">⏹ Hepsini durdur</button>
    </div>
    <div id="cats"></div>
    <section>
      <h2>🎬 Tam yetenek sesleri <small style="color: var(--muted)">(oyundaki zamanlamayla mikslenmiş WAV)</small></h2>
      <div class="skills" id="skills"></div>
    </section>
    <script type="module">
      import { SFXPlayer, SOUNDS, CATEGORIES, byCategory, SKILLS } from '../src/index.js';

      const sfx = new SFXPlayer({ variants: 3 });
      sfx.unlock();
      const cats = document.getElementById('cats');
      const groups = byCategory();
      for (const [cat, list] of Object.entries(groups)) {
        const sec = document.createElement('section');
        sec.innerHTML = `<h2>${CATEGORIES[cat]} <button class="ghost">▶ Sırayla çal</button></h2><div class="grid"></div>`;
        const grid = sec.querySelector('.grid');
        const buttons = [];
        for (const s of list) {
          const b = document.createElement('button');
          b.innerHTML = `${s.loop ? '🔁 ' : ''}${s.name}<small>${s.id}</small>`;
          b.onclick = () => toggle(s, b);
          grid.appendChild(b);
          buttons.push([s, b]);
        }
        sec.querySelector('h2 button').onclick = async () => {
          for (const [s, b] of buttons) {
            if (s.loop) continue;
            const v = sfx.play(s.id);
            b.classList.add('playing');
            await new Promise((r) => setTimeout(r, Math.min(2500, ((sfx.buffers.get(s.id)?.[0]?.duration ?? 1) + 0.3) * 1000)));
            b.classList.remove('playing');
          }
        };
        cats.appendChild(sec);
      }

      function toggle(s, b) {
        if (s.loop) {
          if (sfx.loops.has(s.id)) {
            sfx.stopLoop(s.id);
            b.classList.remove('playing');
          } else {
            sfx.startLoop(s.id);
            b.classList.add('playing');
          }
          return;
        }
        sfx.play(s.id);
        b.classList.add('playing');
        setTimeout(() => b.classList.remove('playing'), 250);
      }

      document.getElementById('vol').oninput = (e) => (sfx.volume = Number(e.target.value));
      document.getElementById('stop').onclick = () => {
        sfx.stopAll();
        document.querySelectorAll('.playing').forEach((b) => b.classList.remove('playing'));
      };

      const sk = document.getElementById('skills');
      for (const id of ['seriAtis', 'taklaAtis', 'okYagmuru', 'olumAtisi', 'golgeAdimi', 'hancerYelpazesi', 'dumanBombasi', 'binKesik']) {
        const d = document.createElement('div');
        d.innerHTML = `${SKILLS[id].emoji} ${SKILLS[id].name}<audio controls preload="none" src="../sesler/yetenek-${id}.wav"></audio>`;
        sk.appendChild(d);
      }

      const t0 = performance.now();
      await sfx.preload(Object.keys(SOUNDS), { onProgress: (k) => (document.getElementById('prog').textContent = `Sesler üretiliyor… %${Math.round(k * 100)}`) });
      document.getElementById('prog').textContent = `✅ ${Object.keys(SOUNDS).length} ses × ${sfx.variants} varyasyon ${((performance.now() - t0) / 1000).toFixed(1)} sn'de üretildi`;
      window.__sfx = sfx;
    </script>
  </body>
</html>
